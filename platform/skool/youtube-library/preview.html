const L = [{"title": "Set up Hermes Agent, your always-on agent", "id": "MzwYKfSxToU", "body": "IN THIS LESSON\nYou'll install Hermes Agent, connect a model, teach it about you, give it a skill and a scheduled job that messages you on Slack, run it free on a local model, and create a second bot.\n\nGOOD TO KNOW\n- Time: 45 to 60 minutes for everything. 10 minutes to say hello.\n- Cost: Hermes is free and open source. You pay for the model: your existing Claude or ChatGPT subscription, or nothing with a local model.\n- Level: Beginner to Intermediate\n- It doesn't replace Claude Code. Claude Code is the specialist you open inside a project. Hermes runs everything around it, even after you close the laptop.\n\nWHAT YOU NEED\n- A computer to run it on (more below)\n- One model, pick one:\n  - Your Claude subscription, ChatGPT/Codex subscription, or Nous Portal\n  - Ollama for free local models: https://ollama.com\n- Slack, optional, for messages on your phone: https://slack.com\n\nSTEPS\n\n1. Pick where it lives (1:35)\nFour options:\n- A dedicated machine like a Mac mini or Mac Studio (can also run local models)\n- A VPS. Hostinger has a Hermes setup ready to go.\n- A spare laptop or old computer\n- The computer you already use (it can still run 24/7)\n\n2. Install it (2:30)\nWebsite: https://hermes-agent.nousresearch.com\n- Terminal version (Mac, Linux, Windows WSL):\n\ncurl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\n\n- Desktop app (what I use for the rest of the video): on the same site, click \"Download for macOS\".\n\n3. Connect a model and say hello (4:00)\nSettings (top right) > Providers. Pick Anthropic (Claude), ChatGPT/Codex, or Nous Portal.\nFor Claude: copy the command it shows, paste it into a terminal, approve in the browser, then click \"I've signed in\". It says Connected.\nStart a new session and type hello. You can switch models under the chat box.\n\n4. Tell it about yourself (5:05)\nPaste this into Claude (or whatever AI you already use) so it writes your intro for you:\n\nWrite a short paragraph about me that I can hand to a new AI assistant. Plain text.\n\nThen paste the answer into Hermes with: \"Here's a bit about myself, save this.\" You'll see \"saved to memory\".\n\n5. See where memory lives (6:40)\nMemory is plain files you can open and edit. They're capped on purpose so they stay short and useful.\n\n6. Connect Slack so it can message your phone (10:20)\nCapabilities > Messaging > Slack, and follow the setup steps there.\n\n7. Turn a task into a skill (11:40)\nDo a task with it once. Then ask it to save that as a skill. Next time you ask for the same thing, it uses the skill. A skill is just a markdown file.\n\n8. Schedule a job (14:40)\nScheduled jobs (top left) > New cron.\n- Name it, write what it should do (mine checks my GitHub for failed runs and open PRs)\n- Pick when (daily, or something like \"weekdays at 9am\")\n- Deliver to Slack\n- Click \"Trigger now\" to test it\n\n9. Run it free on your computer with Ollama (25:25)\nInstall Ollama, then in a terminal:\n\nollama launch hermes\n\nIt offers to download the model if you don't have it.\nTo use the local model in the desktop app: Settings > Providers > Custom endpoints > add one:\n- Name: Ollama\n- Provider ID: ollama-launch\n- URL: http://127.0.0.1:11434/v1\n- API key: any word (I typed test). It's ignored.\nIt should say the endpoint is reachable and list your models.\n\n10. Make a second bot (22:40)\nProfiles let you create separate bots, each with its own memory, skills and jobs. Mine are a code reviewer and a researcher.\n\n11. Have bots hand work to each other (28:20)\nOpen a bot's \"Bot Chat\" session and tell it to message another bot, like \"tell @coder to review the latest commit\". The other bot does the work and reports back.\n\nFILES AND LINKS\n- Hermes Agent: https://hermes-agent.nousresearch.com\n- Docs: https://hermes-agent.nousresearch.com/docs/\n- GitHub: https://github.com/NousResearch/hermes-agent\n- Ollama: https://ollama.com\n\nIF IT BREAKS\n- A bot won't hand off to another bot: you have to be in the session called \"Bot Chat\". Other sessions, including Slack, can't do hand-offs.\n- Typing @botname in Slack does nothing: each bot needs its own Slack app for that. Slack is where bots message you; the desktop app is where you talk to them.\n- The local model errors out right after you pick it: it's usually the context length. Try the same model with a larger context option, or a smaller model.\n- Claude keeps asking you to log in again: re-run the provider sign-in command from Settings > Providers.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code."}, {"title": "Run DeepSeek Harness (free, local, or with Claude Code)", "id": "3xprBcuJKDA", "body": "IN THIS LESSON\nYou'll install DeepSeek Harness, connect a model (cheap cloud or 100% free on your own computer), and have it hand long jobs to Claude Code on the subscription you already pay for.\n\nGOOD TO KNOW\n- Time: 20 to 30 minutes\n- Cost: free with a local model. About $10 of OpenRouter credit if you use the cloud route.\n- Level: Intermediate (you'll use a terminal)\n- It's a developer preview. Things change and break. It doesn't replace Claude Code today.\n\nWHAT YOU NEED\n- Node.js (free): https://nodejs.org\n- One model, pick one:\n  - OpenRouter account with about $10 of credit (paid, cheap): https://openrouter.ai\n  - Ollama for free local models: https://ollama.com\n- Claude Code with a Claude Pro or Max plan, only for the sub-agent part: https://claude.com/claude-code\n\nSTEPS\n\n1. Install and open it (1:39)\nOpen a terminal and run:\n\nnpx @deepseek-ai/dsh web\n\nIt opens in your browser at http://127.0.0.1:3080 . When it asks for a DeepSeek API key, click \"Configure later\". You don't need one.\nSkip the desktop version. It's made by a third party, not DeepSeek.\n\n2. Connect a model with OpenRouter (3:12)\n- Get an API key at openrouter.ai and add about $10 of credit.\n- In Harness: Settings > Models > Add provider > openrouter > paste the key (or sign in) > Apply.\n- Pick a model in the chat box. I used deepseek/deepseek-v4-flash. It's cheap and handles tools.\nOpenRouter's free models exist, but they're rate limited and an agent will hit the limit fast.\n\n3. Or run it 100% free on your computer with Ollama (4:31)\n- Install Ollama and download a model (I used Gemma 4).\n- Start Ollama with a bigger context window so the agent doesn't run out of room:\n\nOLLAMA_CONTEXT_LENGTH=64000 ollama serve\n\n- In Harness: Settings > Models > Add custom provider (the second button, not \"Add provider\"). Fill in:\n  - Display name: Ollama\n  - API base URL: http://127.0.0.1:11434/v1\n  - API protocol: openai-completions\n  - API key: leave it blank (or type ollama)\n- Click \"Fetch available models\", pick yours, and save. A green dot means it's connected.\n\n4. Watch everything the agent does with Trajectory (5:58)\nStart a new workspace and ask it to build something small, like \"create a simple Flask to-do app\". Open the Trajectory tab to see every step: your prompt, the context, the skill it picked, each tool call and the result.\n\n5. Let it build its own tools with Creator mode (8:25)\nSettings > General > Agent preset > Creator mode. Then ask for something like \"add a plugin for a calculator overlay in the bottom right\". Everything in Harness is a plugin (165 of them, even the sidebar), so you can switch pieces on and off.\n\n6. Hand long jobs to Claude Code (11:25)\nThis uses your Claude subscription, not an API key. Claude Code has to be installed and logged in on the same computer.\nInstall the plugin, then restart Harness:\n\ndsh plugin --profile web add @deepseek-ai/dsh-subagent-claude-code\ndsh --profile web\n\nThen turn the delegation tool on. The easiest way is to ask Harness: \"enable the Claude Code sub-agent plugin\". If you'd rather edit it yourself, it lives in ~/.dsh/profiles/web/cordis.patch.yml:\n\n- id: tool-subagent\n  disabled: false\n  config:\n    provider: claude-code\n    toolName: subagent_claude_code\n    backgroundMode: one-shot\n    permissionMode: acceptEdits\n\nRestart again, then try: \"delegate a task to the Claude Code sub-agent to write a simple Fibonacci function\". The hand-off shows up in Trajectory.\n\nFILES AND LINKS\n- DeepSeek Harness on GitHub: https://github.com/deepseek-ai/deepseek-harness\n- Quick start: https://deepseek.com/harness/en/\n- OpenRouter: https://openrouter.ai\n- Ollama: https://ollama.com\n- Composio's plugin list: https://composio.dev/content/best-deepseek-harness-plugins\n\nIF IT BREAKS\n- Ollama model won't connect: you used \"Add provider\" instead of \"Add custom provider\". Ollama needs the custom one.\n- Local model stalls mid-task: Ollama was started without the bigger context. Quit the Ollama app and run the OLLAMA_CONTEXT_LENGTH command above.\n- Claude Code task comes back having done nothing: permissionMode is still the default, which blocks edits. Set it to acceptEdits.\n- New plugin doesn't show up: restart Harness. Every plugin change needs a restart.\n- It restarted its own server and broke (happened to me on camera): run npx @deepseek-ai/dsh web again.\n- One plugin from the Composio list added a pile of skins and wrecked the UI for me. If a plugin makes a mess, disable it and restart.\n\nNEXT\nSet up Hermes Agent, your always-on agent."}, {"title": "Build an AI agent in 5 steps with Claude Code", "id": "WvxPxQ_XlcQ", "body": "IN THIS LESSON\nYou'll build a research agent that pulls the top content on any topic from YouTube, Instagram, TikTok and X, reads what's working, and hands you a brief with ideas. Then you'll put it on a schedule so it runs without you.\n\nGOOD TO KNOW\n- Time: 30 to 45 minutes\n- Cost: Claude Pro or Max plan. Apify gives you $5 of free credit to start, then it's paid.\n- Level: Beginner. No code. You describe the agent and Claude builds it.\n\nWHAT YOU NEED\n- Claude Pro or Max plan, with Claude Code installed: https://claude.com/claude-code\n- Apify account (the tool that collects the social media data): https://apify.com\n- Matt Pocock's skills, for the \"grilling\" skill in step 4: https://github.com/mattpocock/skills\n\nSTEPS\n\n1. Pick where to build it (0:22)\nClaude on the web, the Claude desktop app, or Claude Code in the terminal. I use Claude Code. Make sure you're in auto mode.\n\n2. Describe the agent (0:59)\nPaste this into Claude Code (swap the topic and platforms for yours):\n\nCreate a Claude Code skill called social-me. It takes a topic, researches it across multiple platforms using Apify, reads the top YouTube video transcripts, finds what's working and the content gaps, and gives me a brief with content ideas. Ground everything in real data. Never invent numbers.\n\nIt creates a folder in ~/.claude/skills/social-me with a SKILL.md file. On a Mac, press Command + Shift + Period in Finder to see the hidden .claude folder.\n\n3. Give it tools with the Apify MCP server (2:45)\n- Sign in at apify.com, then go to https://mcp.apify.com\n- Choose Claude Code, turn on \"Add Apify token\", and copy the command it gives you into your terminal\n- In Claude Code type /mcp, pick Apify, and click Authenticate\n- Exit Claude Code and open it again so it loads the new skill. Then type /social-me to run it.\n\n4. Make it better with the grilling skill (8:00)\nInstall Matt Pocock's skills (it's an official Claude Code plugin now). Then type:\n\n/grilling\n\nTell it: \"I want to harden social-me.\" It asks you rounds of questions about what's weak and fixes the skill as you answer. Mine found that Instagram was returning hours-old posts with no engagement, and switched to a list of accounts to watch.\n\n5. Put it on a schedule (12:11)\nTwo options:\n- /loop runs it on your computer. Easy, but your computer has to stay on, and you set it up again after a restart.\n- /schedule makes a Claude routine in the cloud that runs even when your computer is off. I used this one:\n\n/schedule social-me every two days at 7am\n\nCheck it at claude.ai > Routines. The time shows in UTC, so adjust it to your time zone.\n\nFILES AND LINKS\n- The finished skill: https://github.com/tylerprogramming/claude-skills/tree/main/social-me\n- Apify: https://apify.com\n- Apify MCP setup: https://mcp.apify.com\n- Matt Pocock's skills: https://github.com/mattpocock/skills\n\nIF IT BREAKS\n- /social-me doesn't show up: Claude Code only loads new skills when it starts. Exit and open it again.\n- Apify shows \"needs authentication\": run /mcp, pick Apify, authenticate.\n- The routine runs at the wrong hour: routines use UTC. Change the time at claude.ai > Routines.\n- The first version gives weak results: that's normal. That's what step 4 is for.\n\nNEXT\nSet up Hermes Agent, your always-on agent, if you want this running on its own machine 24/7."}, {"title": "Connect Claude and your own agents to your real apps with Arcade (full MCP course)", "id": "1KsadAvYE8k", "body": "IN THIS LESSON\nYou'll connect your apps (ClickUp, Gmail, Google Calendar, Slack) once through Arcade.dev and use them in Claude Code, the Claude desktop app, your own Python agents (LangChain and CrewAI), and agents that run on a schedule.\nYou'll also build your own MCP server without writing code, deploy it so it runs 24/7, and set up a morning briefing that runs every day at 7am. No passwords or tokens stored in a file.\n\nGOOD TO KNOW\n- Time: 2 to 3 hours if you do every module. Steps 1 to 3 alone take about 20 minutes.\n- Cost: Arcade is free to sign up. The Python agents need an OpenAI or Anthropic API key (paid per use). A Hostinger VPS is about $7 to $8 a month, and only if you want it running 24/7.\n- Level: Beginner for steps 1, 2 and 8 (no code). Steps 3 to 7 use the terminal, but Claude writes the code and the course repo has it all.\n- Honest caveat: Claude Routines don't run exactly at 7am. Mine finish a few minutes after.\n\nWHAT YOU NEED\n- Arcade account (sign in with Google), free: https://www.arcade.dev/\n- Claude Code: https://claude.com/claude-code\n- Claude desktop app (for steps 2 and 8)\n- The free course code: https://github.com/tylerprogramming/arcade-course (runs on uv, a Python tool step 5 installs)\n- An OpenAI key (https://platform.openai.com) or an Anthropic key (https://console.anthropic.com), for steps 5 to 7\n- Accounts for the apps you connect. I used ClickUp, Gmail, Google Calendar, Slack and GitHub.\n- Optional: a Hostinger VPS: https://www.hostinger.com\n\nSTEPS\n\n1. Make your first MCP gateway and add it to Claude Code (0:56)\nA gateway is just a bundle of tools from the apps you pick. In the Arcade dashboard, go to MCP Gateways, click Create MCP Gateway, name it (mine was ClickUp Assistant), search for ClickUp and tick it, choose \"members of this project\", then click Create. Pick Claude Code and copy the command Arcade gives you. Paste it in your terminal. The course repo writes it like this:\nclaude mcp add arcade --transport http \"https://api.arcade.dev/mcp/<your-slug>\"\nOpen Claude Code, switch to auto mode (Shift + Tab), then type:\n/mcp\nPick your gateway and press Enter to authenticate. A browser window opens on Arcade. Click allow. Then try it:\nFor my ClickUp assistant, can you get me all my in progress tasks?\nWriting works too. I asked it to add a comment to a task and it showed up in ClickUp.\n\n2. Use the same gateway in the Claude desktop app (7:27)\nIn Arcade, open your gateway, click Connect, choose Claude desktop and copy the URL. In the Claude app go to Settings > Connectors > Add custom connector. Paste the URL, click Add, then Connect, and allow it on Arcade. You can set each tool to always allow or needs approval. Same tools, and you only connected once.\n\n3. Build your own MCP server without writing code (11:21)\nFor a tool that's yours, like your own product. I asked Claude Code to do the install and setup for me. The two commands are:\nuv tool install arcade-mcp\narcade new my_server\nIt comes with example tools (greet, whisper secret, star a repo). Run it on your computer from the my_server/src/my_server folder:\nuv run server.py\nAsk Claude for the command to add this local server to Claude Code, exit Claude Code, paste it, open Claude again and type /mcp to see my_server and its tools. Test it:\nUse the greet tool from my_server with the name Tyler\nWhen it said there was no Arcade API key, I logged in from inside Claude Code (the ! runs a terminal command):\n!arcade login\n\n4. Deploy your server so it runs 24/7 (18:03)\nRunning it locally means your computer has to stay on. From the top folder of the project (the one with pyproject.toml), run:\narcade deploy -e src/my_server/server.py\nWhen it says the deployment is successful, it shows up in the Arcade dashboard under Servers (not MCP Gateways). Make a new gateway with just the tool you want (I picked star a repo), add it to Claude Code like step 1, and authenticate in /mcp. Disable the old local my_server in /mcp so Claude uses the hosted one.\n\n5. Get the code and your keys ready (24:32)\nIn the Arcade dashboard, make an API key (Dashboard > API Keys). Then install uv and set up the course code:\ncurl -LsSf https://astral.sh/uv/install.sh | sh\ngit clone https://github.com/tylerprogramming/arcade-course.git\ncd arcade-course\nuv sync\ncp .env.example .env\nOpen .env and fill in ARCADE_API_KEY, OPENAI_API_KEY (or set LLM_PROVIDER=anthropic and add ANTHROPIC_API_KEY), and ARCADE_USER_ID (your email).\n\n6. Run the same tools in LangChain and CrewAI (29:45)\nThe LangChain email agent chats with you and can read and send Gmail:\nuv run 03-langchain/email_agent.py\nI asked: What are the last three unread emails? Then the email and Slack agent, which gets the whole Slack server:\nuv run 03-langchain/email_slack_agent.py\nCan you summarize all emails from the last 24 hours and send a message in Slack to the #ai channel?\nThe CrewAI version (34:16) runs on its own and lists your email address and three latest subjects:\nuv run 04-crewai/main.py\n\n7. Build the morning planner and schedule it (38:19)\nIt reads today's ClickUp tasks and your Google Calendar and blocks out your day. First see your real tool names, then do a dry run that writes nothing, then let it write:\nuv run 05-scheduled-agent/morning_planner.py --discover\nuv run 05-scheduled-agent/morning_planner.py\nuv run 05-scheduled-agent/morning_planner.py --apply\nTo schedule it, I didn't write the cron job myself. I asked Claude Code:\nCan you schedule the morning_planner.py with --apply on it every morning at 6 a.m. on my computer?\nFor 24/7 without your computer on (44:17), get a Hostinger KVM VPS, open its terminal, run Claude Code there and set up the same agent. The repo's deploy/README.md has the cron steps.\n\n8. Schedule a morning briefing with Claude Routines, no code (46:17)\nIn the Claude app go to Code > Routines and describe it:\nI want to know all my tasks from ClickUp, what's on my calendar and a summary of my emails from the last 24 hours at 7 a.m. every morning.\nClick Draft routine, then Create. In Arcade, make a gateway called Morning Assistant with Gmail, Google Calendar and ClickUp. Add it in Claude under Settings > Connectors > Add custom connector, connect and allow. Edit the routine (pencil icon), remove the other connectors, add Morning Assistant, save, then click Run now to test. Turn on push notifications to get the summary on your phone.\n\nFILES AND LINKS\n- Course code, all modules: https://github.com/tylerprogramming/arcade-course\n- Copy-paste setup guide: https://github.com/tylerprogramming/arcade-course/blob/main/INSTALL.md\n- VPS and cron guide: https://github.com/tylerprogramming/arcade-course/blob/main/deploy/README.md\n- Arcade: https://www.arcade.dev/\n- Arcade MCP gateways: https://api.arcade.dev/dashboard/mcp-gateways\n- Add Arcade to Claude Code, Desktop and Web: https://docs.arcade.dev/en/get-started/mcp-clients\n- Claude custom connectors: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp\n\nIF IT BREAKS\n- Gateway says \"needs authentication\": type /mcp, pick it, press Enter and allow it on Arcade.\n- Claude uses the wrong ClickUp connection: name the gateway in your prompt (\"for my ClickUp assistant\").\n- Custom server says no Arcade API key configured: run !arcade login inside Claude Code.\n- Can't find your deployed server: it's under Servers in the dashboard, not MCP Gateways.\n- Starring a repo failed because the Arcade GitHub connection wasn't allowed to star: add GitHub to the same gateway, save, then re-authenticate in /mcp.\n- Old guides tell you to install langchain-arcade or crewai-arcade: don't. Install LangChain or CrewAI on their own plus the Arcade SDK. The repo already does this.\n- The CrewAI agent errored on an empty page token with the OpenAI model: I pasted the error into Claude and it fixed it.\n- The 6am job didn't run: your Mac was asleep. It runs when it wakes up, or keep it from sleeping, or use a VPS.\n- Routine set to always allow: lock down tools that delete or trash things before you leave it running.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: the exact command Tyler ran with ! at 17:26 was not readable in the transcript. I wrote \"!arcade login\" from the package script. Confirm on screen.\nCHECK: at 15:03 Claude gave Tyler a command to add the local server as a stdio MCP server, but it is not shown in the transcript or repo. Confirm whether to write it out."}, {"title": "Connect Claude Code to Gmail, Calendar, Drive, Docs, Slack and ClickUp with one MCP server", "id": "uEUP4iHJO1Q", "body": "IN THIS LESSON\nYou'll build one MCP gateway in arcade.dev that gives Claude Code access to Gmail, Google Calendar, Google Drive, Google Docs, Slack and ClickUp. Then you'll give it one prompt that reads an email thread, writes a Google Doc, files it in Drive and posts to Slack.\n\nGOOD TO KNOW\n- Time: 15 to 20 minutes\n- Cost: arcade.dev has a free plan to start, with paid plans above that.\n- Level: Beginner. No code. You click tools in a web page and paste one command.\n- Why not just use Claude's own connectors? For you on your own machine, those are fine. Arcade is for when you want other people using it, or an agent running 24/7. Google makes you re-authenticate every seven days unless you're a production-ready app. Arcade handles that for you.\n\nWHAT YOU NEED\n- Claude Code installed: https://claude.com/claude-code\n- arcade.dev account (free to start): https://www.arcade.dev/\n- The accounts you want to connect: Google (Gmail, Calendar, Drive, Docs), Slack, ClickUp\n\nSTEPS\n\n1. Sign in and create your first gateway (1:04)\nSign in at arcade.dev, or create an account if it's your first time. On the left, click MCP Gateways. At the top right, click Create MCP Gateway. Give it a name. I called mine Google Calendar Assistant.\n\n2. Pick only the tools you need (1:41)\nSearch for Gmail and click into its tools. These are the actual functions Claude will be able to call. I picked three: get emails, list emails, send emails. You can click All, but start small.\n\n3. Choose who can connect, then create it (2:18)\nPick \"Members of this project\" if it's just you. The other option is external users who sign in with their own identity provider. Click Create MCP Gateway.\n\n4. Connect it to Claude Code and sign in (2:33)\nArcade shows options for Cursor, Claude Code, Claude Desktop, Codex, or a plain MCP URL. Choose Claude Code and copy the command it gives you. Paste it into a fresh terminal. You should see \"Added HTTP MCP server\" with your gateway name. Don't share it. It's shown on screen in the video, and I deleted mine after recording.\nOpen Claude Code and type:\n\n/mcp\n\nPick your gateway. It says it needs authentication. Press Enter, sign in with Google, click Allow. Then test it:\n\nList all my emails through the Google Calendar Assistant MCP server.\n\nNaming the server makes sure it uses this one, not another Gmail connection you already have. Keep auto mode on.\n\n5. Build a bigger multi-tool gateway (4:06)\nBack in arcade.dev, go to MCP Gateways and create a new one. I called it Multi-Tool Assistant. I selected all tools for Google Calendar, Gmail, Google Drive (17 tools) and Slack. That came to 65 tools. Normally you'd narrow that down, but it shows it can do all of it at once. Pick Members of this project, create it, copy the Claude Code command, paste it in the terminal. Then in Claude Code, /mcp, pick Multi-Tool Assistant, authenticate.\n\n6. Turn off the servers you don't want it using (5:56)\nIn /mcp, I disabled my other Gmail, Calendar, Drive and Slack connections. Now anything I ask about those apps goes through the Multi-Tool Assistant. Test it:\n\nCan you read the last 10 emails I had and then any specific calendar events I have for today?\n\n7. Run the five-step prompt (6:58)\nThis is the one that touches four apps. Swap in your own email thread, folder and channel:\n\nSummarize my partnership emails with Blotato in Gmail, create a doc with that summary, save it to Google Drive in a folder named Blotato, and then send me a Slack message in the ai channel.\n\nGoogle Drive tools can't write a document on their own. I added Google Docs to the gateway so it could create the doc, then move it into the folder. Check Drive and Slack to see the results.\n\n8. Add a new app to a live gateway (9:52)\nIn arcade.dev, open your gateway and click the pencil to edit. Search for ClickUp, click All, then Save. Back in Claude Code, type /mcp, pick the gateway, and re-authenticate. Allow the new access. Then:\n\nHow many tasks do I have?\n\n9. Add your team (10:47)\nIn your Arcade project you can invite members. Each one signs in separately as their own user. Or set up your own sign-in provider with a client ID and secret. Either way you don't handle their tokens.\n\nFILES AND LINKS\n- arcade.dev: https://www.arcade.dev/\n- arcade.dev pricing: https://www.arcade.dev/pricing\n- Claude Code + Arcade docs: https://docs.arcade.dev/en/get-started/mcp-clients/claude-code\n- Free content skills: https://free.tylerai.dev/content-automation\n\nIF IT BREAKS\n- Gateway shows \"needs authentication\" in /mcp: press Enter on it and sign in again.\n- You added a tool and Claude can't use it: any time you add tools to a gateway that already exists, re-authenticate in /mcp. I hit this with Google Docs.\n- It uses the wrong Gmail or Slack connection: disable the other servers in /mcp, or name the gateway in your prompt.\n- It can't create a doc in Drive: Drive tools alone can't write documents. Add Google Docs tools to the gateway, then re-authenticate.\n- Too many tools to pick from: select only what the job needs. 65 tools works, but fewer is cleaner.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: The five-step prompt in step 7 is rebuilt from a garbled transcript (7:06). Swap in Tyler's exact wording, since the description promises \"the exact prompt I used\" is in the community."}, {"title": "Run your YouTube channel with 9 Claude Code skills, from research to upload", "id": "GJQCUcx4roA", "body": "IN THIS LESSON\nYou'll run the nine skills I use for every video, in order: research what's working, transcribe a winning video, build the full package (titles, hooks, script), make thumbnails, fix the SEO, plan Shorts, write social posts, add chapters, and upload.\nBy the end you can take one idea from research to a scheduled upload, all inside Claude Code.\n\nGOOD TO KNOW\n- Time: about an hour for your first video package, plus a one-time 10 minute Google setup if you want to upload from Claude Code.\n- Cost: Claude Code needs a paid Claude plan. Thumbnails run on Kie.ai, paid but cheap per image. Three thumbnails cost me $0.27. Transcribing uses OpenAI Whisper, either the paid API or the free version on your own computer.\n- Level: Beginner. You type commands and answer questions. The skills do the rest.\n- Honest caveat: the skills plan, package and publish. You still film and edit the video yourself.\n\nWHAT YOU NEED\n- Claude Code (paid Claude plan): https://claude.com/claude-code\n- My free skills (GitHub repo): https://github.com/tylerprogramming/claude-skills\n- yt-dlp, free, the tool the research and transcribe skills use to read YouTube: https://github.com/yt-dlp/yt-dlp\n- OpenAI API key for Whisper transcription, paid (sign-in page): https://platform.openai.com/api-keys\n- Kie.ai account and API key for thumbnails, paid per image: https://kie.ai\n- ffmpeg, free, for the chapters skill: https://ffmpeg.org\n- Optional, for uploading: a Google Cloud project with the YouTube Data API v3: https://console.cloud.google.com\n\nSTEPS\n\n1. Install the skills (0:29)\nEverything you need is in the Google Doc and the GitHub repo. In your terminal:\n\ngit clone https://github.com/tylerprogramming/claude-skills.git ~/projects/tyler-skills\ncd ~/projects/tyler-skills && ./setup.sh\n\nThen open Claude Code and paste:\n\nLook at ~/projects/tyler-skills and import the yt-search, yt-deep-research, transcribe, yt-package, yt-seo, yt-thumbnail, yt-shorts, social-copy, yt-chapters and yt-upload skills into my ~/.claude/skills, then tell me what setup each one needs.\n\nA skill is just a text file that tells Claude how to do one job the same way every time. Some come with a Python file that does the heavy lifting.\n\n2. Research what's working (1:16)\n/yt-search claude code\n\nIt searches YouTube for the last 30 days, pulls 50 videos, ranks the top 15, splits long form from Shorts, and downloads their thumbnails. You get the top videos, title and thumbnail patterns, and video ideas, saved on your computer. It takes a few minutes. Want a longer window? Ask for 90 days instead.\n/yt-deep-research does the search and transcribes the top videos for you in one go. Use it once you know the process.\n\n3. Transcribe a winning video (4:02)\nPick the top video from your research. I typed:\n\n/transcribe Nate's video\n\nYou don't need the slash. \"Transcribe the number one video\" works too, or paste a YouTube link. It saves the transcript and tells you why the video worked: the structure, the hook, the calls to action.\n\n4. Build the full video package (6:16)\n/yt-package <the transcript file it just saved>\n\nIt does its own web research, then asks you questions: your angle, which of your own work to demo, who it's for. Answer them. This step takes the longest. It creates a folder with titles, hooks, the script, the description, tags, an analysis, and reference thumbnails. The script is a guide, not something to read word for word.\n\n5. Make thumbnails with Kie.ai (10:58)\n/yt-thumbnail use this video's reference thumbnail to create three more\n\nNano Banana Pro is my favorite model on Kie.ai. The skill used a photo of my face as a reference. It made three concepts for $0.27. Treat them as ideas you can edit, not final art.\n\n6. Fix the title and description (13:12)\n/yt-seo on this video package\n\nIt checks title patterns from your research and the web, gives you a title scorecard with options to A/B test, and updates the titles, description and tags in your package.\n\n7. Plan Shorts and social posts (14:47)\n/yt-shorts get ideas from this video package\n\nI got five Short ideas: two talking head, two screen recording, one mix. One Short can go to TikTok, YouTube Shorts, Instagram Reels, Facebook and Bluesky.\nAfter you record, run /social-copy on the video. It writes posts for X, LinkedIn, Instagram, YouTube Community and Skool.\n\n8. Film, edit, then add real chapters (17:00)\nFilming and editing are the human part. When the final video is done:\n\n/yt-chapters /path/to/final-video.mp4\n\nIt pulls the audio, transcribes your video, and puts real timestamps in your package description.\n\n9. Upload and schedule (18:50)\n/yt-upload uses the YouTube Data API v3 to upload and schedule. It needs a one-time setup first:\n- In Google Cloud Console, create a project and enable the YouTube Data API v3.\n- Set up the OAuth consent screen and add your own email as a test user.\n- Create an OAuth client (Desktop app), download the JSON, and save it as credentials.json in your home folder.\n- Run /yt-upload once. A browser opens, you approve, and token.json is created. After that it's one command.\n\nFILES AND LINKS\n- Free skills and newsletter: https://free.tylerai.dev/youtube/\n- The skills repo: https://github.com/tylerprogramming/claude-skills\n- The YouTube Workflow doc (the full flow and the upload setup): https://docs.google.com/document/d/1JgGYBcrfcDhXowmYt6CRRkZATggf695ZL9umDb1ffFE/edit\n- Kie.ai: https://kie.ai\n- Free community: https://www.skool.com/the-ai-agency\n\nIF IT BREAKS\n- /thumbnail does nothing: I renamed it. Use /yt-thumbnail.\n- Research or transcribing seems stuck: it takes a few minutes. Let it finish.\n- The chapters in your package description are wrong: they're placeholders until you run /yt-chapters on the finished video.\n- /yt-search fails: check yt-dlp is installed with: yt-dlp --version\n- Thumbnails fail with a 401 error: your KIE_API_KEY is missing or wrong. It goes in ~/.claude/.env.\n- /yt-upload won't connect: you skipped the one-time Google setup in step 9.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: The video says Whisper can run free on your own computer, but the transcribe skill in the repo checks for OPENAI_API_KEY (paid API). Confirm whether a local-Whisper option exists before promising \"free\".\nCHECK: The description and video promise the skills \"in the community\". Confirm the Skool classroom actually has them, or point people to free.tylerai.dev/youtube/ and the GitHub repo only."}, {"title": "Run your content business with 17 Claude Code skills: research, script, repurpose, email and community", "id": "-dEeg0WnJxs", "body": "IN THIS LESSON\nYou'll get the 17 Claude Code skills I use every week and see how they fit into three systems: a YouTube engine that researches and writes my videos, distribution skills that turn one video into 30+ pieces, and community and money skills for email and Skool.\nYou don't need all 17. Start with a few, run them on your own topic, and add more as you go.\n\nGOOD TO KNOW\n- Time: about 10 minutes to download and drop in the skills. Each skill then runs in a few minutes. The Google setup for analytics and replies takes 5 to 10 minutes.\n- Cost: the skills are free. You need Claude Code. A few skills need a key of your own (OpenAI for transcripts, Google for analytics and replies, Resend for email).\n- Level: Beginner for the YouTube engine and distribution. /skool, /instagram-writer and /tiktok-replier are more advanced.\n- Honest caveat: they might not all work for you out of the box. Some need things installed first. The download's README says which ones up front.\n\nWHAT YOU NEED\n- Claude Code (the skills install into Claude Code, not claude.ai web or mobile): https://claude.com/claude-code\n- The 17 skills, free: https://free.tylerai.dev/content-automation\n- For /transcribe: an OpenAI API key (paid, I use it because it's accurate and gives timestamps) at https://platform.openai.com (returns 403 to bots, real sign-in page), or Whisper running locally for free: https://github.com/openai/whisper\n- For /yt-analytics and /yt-replier: a Google Cloud project with the YouTube Data API v3 turned on (free): https://console.cloud.google.com\n- For /email: a Resend account (I send through the Resend MCP server): https://resend.com\n- Optional, for scheduling posts: Blotato, https://www.blotato.com\n- Optional, for /tiktok-replier: Claude in Chrome, https://claude.com/chrome\n\nSTEPS\n\n1. Get the skills into Claude Code (0:00)\nDownload the kit from https://free.tylerai.dev/content-automation and put the skill folders in your Claude Code skills folder:\n~/.claude/skills\nEach skill is a folder with a text file in it. Here are the 17:\n- YouTube engine: /yt-search /transcribe /yt-package /yt-seo /yt-thumbnail /yt-analytics /yt-replier\n- Distribution: /yt-shorts /repurpose /social-copy /instagram-writer /flash-video /tiktok-replier\n- Community and money: /skool (called /skool-post in the kit) /email /harut /journal\n\n2. Find what's already working with /yt-search (2:58)\nGive it your keywords, the same way you'd search YouTube:\n/yt-search claude code\nIt searches the last 30 days, pulls 50 videos per keyword, and keeps the top 15. It saves the views, likes, comments, length, descriptions and thumbnails locally, explains why the thumbnails and titles worked, finds the gap nobody covers, and gives you about five video ideas. It uses yt-dlp under the hood, which runs locally and is free.\n\n3. Study the winners with /transcribe (6:07)\nPick the videos you want from the search results. I skipped the six hour one:\nTranscribe number one and number five.\nIt saves the transcripts and breaks down each video's structure: how long the cold open was, each section, where the sponsor sat.\n\n4. Build the video plan with /yt-package (7:57)\nRun:\n/yt-package\nIt uses the research plus what Claude Code already knows about you. When it asks questions, I just say:\nrecommended\nYou get a folder of text files: analysis, description, filming guide, hooks, script and titles (five options). I don't read the script word for word. It's my guideline.\n\n5. After you record: /yt-seo, then /yt-analytics and /yt-replier (10:26)\nOnce the video is recorded and edited, run /yt-seo on it. It does web search on top of the YouTube research and checks your title, description, tags and thumbnail against competitors. Mine suggested an A/B title test, so I answered:\nyes, do the recommended\nAfter the video is live, /yt-analytics checks CTR and how it's performing, and /yt-replier finds comments you haven't replied to yet (13:22). Both need a Google Cloud project with the YouTube Data API v3 enabled and a token downloaded to your computer. Ask Claude to walk you through it.\n\n6. Turn one video into 30+ pieces: /yt-shorts and /repurpose (14:23)\n/yt-shorts looks forward. Use it on an idea or package you haven't recorded yet:\n/yt-shorts on the most recent package\nIt writes scripts, on-screen text, captions and a filming plan for reels, plus carousel ideas. Five reels posted to six platforms is 30 pieces of content.\n/repurpose looks back. Use it on a video you already made. It reads the transcript and writes new reels, text and image posts from it.\n\n7. Write the posts and carousels: /social-copy and /instagram-writer (17:37)\n/social-copy the recent video package we have been working on\nIt writes LinkedIn, X, Instagram, YouTube community, Skool and email drafts into a social folder next to the package, in your voice (I tell it no em dashes). From there Claude can send the emails if Gmail is connected, or I schedule the posts with Blotato.\nFor carousels (23:06), clear the session first, then run:\n/clear\n/instagram-writer the 17 claude skills video\nIt asks which angle you like, then writes the slides. Rendering them needs some extra code installed.\nOptional (22:15): /flash-video turns a static image into a 4 second reel with music. /tiktok-replier uses Claude in Chrome, because TikTok has no simple way to reply through an API.\n\n8. Community and money: /skool, /email, /harut, /journal (23:50)\n- /skool turns one video into several community posts. Skip it if you don't have a Skool community.\n- /email writes email copy (one video can become 3 or 4 emails in a week, or a day 0 to 7 welcome sequence). I send mine with Resend.\n- /harut is a searchable assistant built from Harut's 21 hour Skool course. Ask it business questions:\n/harut on the YouTube package, how should I send emails and what can I do to bring in people to community who then become customers\nYou can build the same thing for any expert in your space.\n- /journal is where I log what went well, what didn't, and when I'm free to record.\n\n9. Pick your starting set (30:34)\nDon't start with all 17. I'd take four from the YouTube engine, three from distribution and three from community and money. The rest are extras. Then improve them as you use them.\n\nFILES AND LINKS\n- All 17 skills, free: https://free.tylerai.dev/content-automation\n- Claude Code: https://claude.com/claude-code\n- yt-dlp (what /yt-search uses): https://github.com/yt-dlp/yt-dlp\n- Whisper (free local transcription): https://github.com/openai/whisper\n- Google Cloud console: https://console.cloud.google.com\n- Resend: https://resend.com\n- Blotato: https://www.blotato.com\n- The free community, ask setup questions here: https://www.skool.com/the-ai-agency\n\nIF IT BREAKS\n- A skill doesn't work out of the box: some need things installed or a key first. Check the README, or ask Claude Code what's missing.\n- /yt-analytics or /yt-replier can't get your data: you need the Google Cloud project, the YouTube Data API v3 enabled, and the token downloaded locally.\n- Transcripts cost money: switch /transcribe to Whisper running locally, which is free.\n- The session gets cluttered after a long run: type /clear before the next skill.\n- /skool does nothing useful for you: it's optional. Skip it if you don't run a Skool community.\n\nNEXT\nSet up Hermes Agent, your always-on agent\n\nCHECK: At 30:34 I point at my recommended starter skills on screen (four YouTube engine, three distribution, three community) but don't name them out loud. Confirm which ones and list them in step 9.\nCHECK: Transcript says the Harut skill can be had \"from GitHub\". Confirm whether the kit download or a GitHub repo is the right place to point people.\nCHECK: Confirm the kit's skill is /skool-post and the video's /skool is the same one."}, {"title": "Run my 6-test model benchmark: Claude Opus 5 vs Opus 4.8 vs Fable 5", "id": "J5lkE_jBEko", "body": "IN THIS LESSON\nYou'll install my model-bench skill and run the same six prompts I used through Opus 4.8, Opus 5 and Fable 5. You get each model's output side by side with its cost and time, plus my full scorecard to compare against.\n\nGOOD TO KNOW\n- Time: 10 minutes to set up. If you run all six tests, expect 35 to 40 minutes of waiting. The models run one after another.\n- Cost: it runs through Claude Code on your Claude plan, so there's no API key and no per-token bill. The cost column is what the same run would cost on the API.\n- Level: Intermediate. You'll paste a few commands into a terminal.\n- Prices: Opus 5 and Opus 4.8 are $5 per million input tokens and $25 per million output. Fable 5 is $10 and $50. So Opus 5 is half the price of Fable per token.\n- The catch: Opus 5 wrote 2 to 4 times more code than the others on builds. Half the price per token didn't always mean a cheaper job. In my runs 4.8 was the cheapest and fastest every time.\n- These are one-shot prompts with tools turned off, not a full agent session. The models are not deterministic, so your numbers will differ from mine.\n\nWHAT YOU NEED\n- Claude Pro or Max plan, with Claude Code installed and logged in: https://claude.com/claude-code\n- Plans and prices: https://claude.com/pricing\n- Python 3.9 or newer (free): https://www.python.org/downloads/\n- My model-bench skill (free): https://github.com/tylerprogramming/claude-skills/tree/main/model-bench\n\nSTEPS\n\n1. Install the model-bench skill (11:09)\nOpen a terminal and run these four lines:\n\nmkdir -p ~/.claude/skills/model-bench && cd ~/.claude/skills/model-bench\ncurl -O https://raw.githubusercontent.com/tylerprogramming/claude-skills/main/model-bench/SKILL.md\ncurl -O https://raw.githubusercontent.com/tylerprogramming/claude-skills/main/model-bench/bench.py\ncd ~\n\nRestart Claude Code so it loads the skill. Then type /model-bench and paste any prompt below. It runs that prompt on all three models for you. If you'd rather skip Claude Code, run the script yourself:\n\npython3 ~/.claude/skills/model-bench/bench.py \"<prompt>\" --slug <name>\n\nResults land in ~/content/research/benchmarks/<name>/ with a compare.html that opens side by side, plus results.md with tokens, cost and time.\n\n2. Test 1: hexagon ball in Python (3:04)\npython3 ~/.claude/skills/model-bench/bench.py \"Write a Python program that shows a ball bouncing inside a spinning hexagon. The ball should be affected by gravity and friction, and it must bounce off the rotating walls realistically.\" --slug hexagon-ball\n\nPython files never run on their own. Open the folder and run each one, for example python3 opus-5.py. My result: Opus 5 was the most realistic and let me change gravity. 4.8 was plain.\n\n3. Test 2: 3D solar system (5:33)\npython3 ~/.claude/skills/model-bench/bench.py \"Create a 3D solar system in a single self-contained HTML file using three.js loaded from a CDN. The sun at the center, planets orbiting at different speeds, and a camera you can orbit with the mouse. No build step, it should just run when the file is opened.\" --slug solar-system\n\nMy result: Opus 5 added planet labels and a timescale. Fable 5 was close. A better prompt would close most of the gap.\n\n4. Tests 3 and 4: Suika merge game and Flappy Bird (8:05)\npython3 ~/.claude/skills/model-bench/bench.py \"Build a complete, playable Suika (watermelon merge) game in a single self-contained HTML file, vanilla JavaScript and canvas, no libraries. Fruits drop from the top, same-size fruits merge into the next size with gravity and collisions, score goes up on each merge, and it is game over if the pile overflows the top. Make it fun to play.\" --slug suika-html\n\npython3 ~/.claude/skills/model-bench/bench.py \"Build Flappy Bird as a single self-contained HTML file, vanilla JavaScript, no libraries. The bird flaps on spacebar or click with gravity, pipes scroll in from the right with gaps, collision detection, a score counter, and a game over screen with restart.\" --slug flappy-html\n\nMy result: I liked Fable 5's Suika best, but it cost the most. All three Flappy Birds worked. The models already know that game well, so the model matters less.\n\n5. Test 5: design to code with a screenshot (11:09)\nFind a landing page design you like (I grabbed one from Google Images), save the screenshot, and swap its path in below:\n\npython3 ~/.claude/skills/model-bench/bench.py \"Here is a screenshot of a landing page design. Rebuild it as a working front end that matches the layout, spacing, colors, typography, and button styles as closely as you can. Clean semantic HTML and modern CSS (flexbox/grid), fully responsive down to mobile, no framework, one file.\" --image ~/Desktop/landing.png --slug design-to-code\n\nIn Claude Code you can just drag the image into /model-bench instead. My result: Opus 5 was closest to the original colors. Fable 5 had good layout but a gray tint.\n\n6. Test 6: the reasoning trio (14:22)\nRun each question as its own prompt, same command as above:\n\nHow many r's are in the word strawberry?\nAlice has 3 brothers and 2 sisters. How many sisters does Alice's brother have?\nA marble is put in a glass, the glass is turned upside down on a table, then the glass is picked up and put in the microwave. Where is the marble?\n\nAll three models got all three right. Opus 5 answered strawberry with one word.\n\n7. Score it and compare to mine (15:16)\nOpen each compare.html, play each build, and fill in the Runs? and Score columns in results.md. Cost and time are already filled in. My scorecard (equivalent API cost, 4.8 / Opus 5 / Fable 5):\n- Hexagon ball: $0.10 / $0.28 / $0.24\n- Solar system: $0.11 / $0.49 / $0.51\n- Suika: $0.34 / $0.70 / $1.71\n- Flappy Bird: $0.12 / $0.25 / $0.29\n- Design to code: $0.16 / $0.30 / $0.39\n- All 8 prompts: about $0.84 / $2.02 / $3.16\nEvery build ran on all three models. My take: Opus 5 over-generates on builds but catches and fixes its own errors as it goes. Fable 5 is usually faster but always the priciest. 4.8 is the cheapest. I'm still using Opus 5 for my own work, and it hasn't broken a single skill for me.\n\nFILES AND LINKS\n- model-bench skill: https://github.com/tylerprogramming/claude-skills/tree/main/model-bench\n- Anthropic's Opus 5 announcement: https://www.anthropic.com/news/claude-opus-5\n- Opus 5 API pricing on OpenRouter: https://openrouter.ai/anthropic/claude-opus-5\n- Claude Code: https://claude.com/claude-code\n\nIF IT BREAKS\n- /model-bench doesn't show up: Claude Code only loads new skills when it starts. Exit and open it again.\n- \"claude CLI not found on PATH\": the script calls Claude Code. Install it and log in, then try again.\n- A model's column says FAILED: that model isn't available on your plan, or it hit the time limit. Add --timeout 1800 for long builds like Suika.\n- The hexagon ball won't run: all three models wrote it with pygame, so you need pygame installed. To watch all three at once, I had to resize the windows so they fit side by side.\n- Opus 5 seems worse for you than for me: add context, plan first, and give it guardrails. One-shot prompts are the hardest test for any model.\n- It still hallucinates sometimes. It told me I had a skill I don't have. Ask \"are you sure?\" and it corrects itself.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: Design to code cost for Opus 4.8. At 14:00 I say 60 cents, the scorecard file says $0.16. The lesson uses the scorecard."}, {"title": "Edit your videos by talking to Claude Code: captions, silence cuts and animations", "id": "cdvi2ooarDc", "body": "IN THIS LESSON\nYou'll install HeyGen's free HyperFrames skills into Claude Code, then edit a real clip just by asking: add word-by-word captions, cut the dead air, add transitions and B-roll.\nThen you'll open HyperFrames Studio and turn a single screenshot into an animated intro or graph.\n\nGOOD TO KNOW\n- Time: about an hour for setup and your first caption job. Each render takes a few minutes, longer the first time.\n- Cost: HyperFrames is free and open source. Claude Code needs a paid Claude plan. Optional: I paid Seedance roughly 9 cents for one 3 second B-roll clip.\n- Level: Beginner. No editing software and no code. You type what you want in plain English.\n- Honest caveat: this is not one-click magic. The slick results you see online took back-and-forth to get right. Expect to have a conversation with it.\n\nWHAT YOU NEED\n- Claude Code (paid Claude plan): https://claude.com/claude-code\n- HyperFrames, free, on HeyGen's GitHub: https://github.com/heygen-com/hyperframes\n- Node.js 22 or newer, free (HyperFrames needs it): https://nodejs.org\n- FFmpeg, free (HyperFrames uses it to render): https://ffmpeg.org\n- A raw video clip. Mine was a 25 second HeyGen avatar clip with no captions, and a 3 minute talking clip with pauses.\n\nSTEPS\n\n1. Install the HyperFrames skills (0:40)\nGo to the HyperFrames GitHub page, copy the install command and paste it into your terminal:\n\nnpx skills add heygen-com/hyperframes\n\nIt asks which agents to install to. Pick Claude Code. I got about 20 skills (hyperframes, figma, faceless explainer and more).\n\n2. Open Claude Code and check the skill is there (1:59)\nUpdate Claude Code first, start it, and turn auto mode on. Then type:\n\n/hyperframes\n\nIf it shows up, you're ready.\n\n3. Add captions to a clip (2:20)\nGive it the path to your video and ask:\n\n/hyperframes /path/to/your-video.mp4 can you add captions to this?\n\nIt transcribes your audio with Whisper so it knows the exact time of every word, then puts the captions on the video. It gave me style options and I picked one. Took a few minutes running in the background.\n\n4. Swap in a different caption style from the catalog (4:07)\nOpen the catalog: https://hyperframes.heygen.com/catalog\nPick a style (pill karaoke, matrix decode, neon accent, kinetic slam, highlight). Each one has an install command. I used highlight:\n\nnpx hyperframes add caption-highlight\n\nThen ask Claude Code to redo the captions with it, in your own words, something like:\n\nRecreate the captions on this video using the caption-highlight component I just installed.\n\nThe catalog also has animated macOS windows, a YouTube lower third, transitions, app showcases, a US map with data and flowcharts. Every change renders a new MP4.\n\n5. Cut out the dead air (7:33)\n\n/hyperframes cut out silences from this video /path/to/your-video.mp4\n\nMy 3 minute 1 second clip came back at 1 minute 50 seconds. On a 30 minute video, that can take you down to 15 or 20 minutes.\n\n6. Add transitions, animations and B-roll (8:57)\nThis is what I typed after the silence cut:\n\nNow add transitions, animations where it may be right to do so, with text such as software I mentioned like Gmail, Slack. Go through this, see where you think we need to add transitions and cuts, add B-roll and more.\n\nThen keep talking to it until you like it. I wasn't happy with one B-roll shot, so I made that 3 second clip in Seedance and Claude Code put it in.\n\n7. Open HyperFrames Studio (10:40)\nStart a new project from your terminal (or ask Claude Code to do it with /hyperframes init):\n\nnpx hyperframes init my-video\n\nThen open the Studio in your browser:\n\nnpx hyperframes preview\n\nIn the Studio you can click every layer (the head, the arm) and move it yourself, or tell Claude Code what to fix.\n\n8. Turn a screenshot into an animation (11:27)\nTake a screenshot of anything you like, drag it into the terminal with Claude Code open, and ask. My two prompts:\n\nCan you animate this with a guy waving in the intro to this video, please?\n\nBefore the previous one we just did, can you add this where the graph is about YouTube views, adding zoom in and following the graph. Make it about four seconds. Just make it awesome.\n\nIt built the full animation from one screenshot. The more you do this, the faster it learns your style.\n\nFILES AND LINKS\n- HyperFrames on GitHub: https://github.com/heygen-com/hyperframes\n- Style catalog: https://hyperframes.heygen.com/catalog\n- Highlight caption style (the one I installed): https://hyperframes.heygen.com/catalog/components/caption-highlight\n- HyperFrames quickstart: https://hyperframes.heygen.com/quickstart\n\nIF IT BREAKS\n- /hyperframes doesn't show up: update Claude Code, then exit and open it again so it loads the new skills.\n- The first job seems stuck: the first run takes a few minutes. Let it work.\n- The result isn't what you wanted: that's normal. Tell it exactly what's wrong (\"the captions are too small\", \"the hair's not quite right\") and it re-renders.\n- Claude's B-roll looks off: generate that one shot with a video model like Seedance (small paid cost) and ask Claude Code to drop it in.\n- A render fails on the resolution setting: --resolution takes named presets like landscape or 1080p, not 1920x1080.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: The install command in step 1 is taken from the HyperFrames README, not shown on screen. Confirm it matches what Tyler copied at 1:00 (the README now also offers a Claude Code plugin: claude plugin marketplace add heygen-com/hyperframes)."}, {"title": "Make a 30-second product ad with the ElevenLabs Flows Agent", "id": "WJabXRVe8JQ", "body": "IN THIS LESSON\nYou'll upload one product photo, paste one prompt, and let the Flows Agent in ElevenCreative build the whole ad pipeline: images, video clips, voiceover, music and the final edit.\nThen you'll change it by talking to the agent, and swap in a new product to reuse the same flow.\n\nGOOD TO KNOW\n- Time: I built the coffee ad live during the recording. Plan on an hour for your first one so you can iterate.\n- Cost: Paid. The Starter plan gives 30,000 credits a month, the Creator plan 121,000. My ad came to about 32,000 credits, so you really need Creator for this. The agent chat is billed on tokens and every generation uses credits, so each re-run costs you.\n- Level: Beginner. No code. You talk to the agent and it builds the nodes.\n- Flows is in alpha, so the screens may look a little different when you try it.\n- It's not really one prompt. My Pepsi ad had a long conversation behind it. Expect to iterate.\n- This is a paid partnership. I'm an ElevenLabs ambassador.\n- Partner link: the ElevenLabs link below is my partner link. I get paid if you sign up through it.\n\nWHAT YOU NEED\n- An ElevenLabs account, Creator plan recommended (paid). My partner link: https://try.elevenlabs.io/8n9sgoi23fkk\n- Plans and credits: https://elevenlabs.io/pricing\n- One photo of your product, saved on your computer (a bag, can, bottle, whatever you sell)\n\nSTEPS\n\n1. Open Flows in ElevenCreative (0:33)\nElevenLabs has three areas: ElevenCreative, ElevenAgents and the API. Go to ElevenCreative, then Flows. Open one of the example flows first, like the luxury perfume ad, to see how image, video, voiceover and composition nodes connect.\n\n2. Set the agent permissions before you spend (15:38)\nAt the bottom of the agent chat there are three modes:\n- Auto run: it runs everything with no confirmation.\n- Confirm edits: you approve each step.\n- Auto under threshold: it runs anything under a credit limit and asks about the rest. This is the one they recommend. Mine was set to 300, so a 178 credit GPT Image 2 node just ran.\n\n3. Start a new flow and paste the prompt (4:29)\nClick Create new flow. You can build nodes by hand from the bottom bar, but I let the agent do it. Paste this into the agent chat (swap EMBER and the scenes for your product):\n\nI've uploaded my real product photo - a coffee bag for a small batch brand called EMBER. Use it as the style reference and generate 5 more images that MATCH its design, color palette, lighting, and mood, so they look like the same brand campaign, but showing different subjects: coffee beans on warm wood, a cozy coffee house interior, a person in a cozy sweater holding a mug in morning light, a close-up pour with steam rising, and a warm windowsill at sunrise. Keep all 5 consistent with my uploaded product's look. Then feed all 6 images into a video node as references and generate a 30 second cinematic ad from them, warm and unhurried, golden morning light. Add a warm voiceover with Eleven v3 reading exactly: 'Some mornings you wake up. Others, you rise. EMBER is slow roasted in small batches, for the cup that actually earns its place in your hands. Rich. Warm. Unhurried. EMBER. Mornings worth waking up for.' Add gentle warm instrumental music with a small lift at the end. Assemble everything into one 30 second ad in a Composition node.\n\nThen upload your product photo into the flow. I used a Tom Hanks coffee bag from a Google search. Make the brand name in the prompt match your photo. I didn't, and that's why my ad says Ember.\n\n4. Pick a voice and let it build the nodes (6:25)\nThe agent offers a few voices to preview. I picked Frank. It lays out its plan (five campaign images, a 30 second ad, voiceover, music, composition) and then creates the nodes. Each node shows its model and credit cost. You can change the model, aspect ratio and resolution. I chose GPT Image 2 because it costs less than Nano Banana. Count the image nodes. Mine made three, so I typed:\n\nI only see three image generation nodes. I thought we were doing five.\n\n5. Animate the clips (8:59)\nThe agent turns each image into a video clip. You can pick the video model and filter by realistic or upscaling. Most models only do set lengths, like 4, 6 and 8 seconds for Veo 3.1 Fast, or 2 second clips from a Runway model. Messy canvas? Select all the nodes, right click, and choose Tidy up.\n\n6. Watch the composition (10:44)\nEverything lands in the Composition node: one video track, plus audio tracks for voiceover and music. Download it and watch it.\n\n7. Change it by talking (11:40)\nMy first cut never showed the word Ember on screen. So I typed:\n\nFor the first and last video, we should have Ember cinematically onto the video as well as text.\n\nIt regenerated those two images with two options each, then re-animated them. Check it didn't leave the old nodes behind. I had to ask it to remove the original two. Then rerun the Composition node (13:25) and download again. Rerunning the composition costs no credits.\n\n8. Swap in a new product (14:47)\nReplace the photo at the top of the flow and click Run from here. If it's a different kind of product, ask the agent to update the image, video and music prompts first, or your energy drink ad will sound like a cozy coffee shop:\n\nThis is my new product. We need the prompts updated for this product now.\n\nFILES AND LINKS\n- ElevenLabs (my partner link): https://try.elevenlabs.io/8n9sgoi23fkk\n- ElevenCreative: https://elevenlabs.io/creative\n- Flows (sign in first): https://elevenlabs.io/app/flows\n- Pricing and credits: https://elevenlabs.io/pricing\n\nIF IT BREAKS\n- Fewer image nodes than it promised: tell it how many you see and how many you expected. It adds the rest.\n- Your edit doesn't show up in the final ad: rerun the Composition node. It only picks up updated clips when you run it again. It's free.\n- Old nodes still wired in after a change: ask the agent to remove the originals.\n- You can't make a clip an exact length: video models have fixed durations. Pick a model whose lengths fit your script.\n- Seedance says it's not available: it isn't offered in the US. Pick another video model.\n- The cost estimate looks huge: mine said $450, which was not correct. Go by the credit number. Mine was about 32,000.\n- The ad mentions the wrong brand: your prompt and your photo don't match. Ask the agent to redo the prompts based on your uploaded image.\n\nNEXT\nBuild an AI agent in 5 steps with Claude Code\n\nCHECK: In the video I say the step-by-step doc and the flow template are linked in the description. Neither link is there. The flow URL in the package (https://elevenlabs.io/app/flows/rLP9x4JJoyjN2F5frt3P) needs sharing set to \"Link only\" before it can be added here, and the server returns 200 for any flow ID, so I couldn't confirm it opens for others.\nCHECK: The YouTube description says \"partner link + code\" but the brief says it's link-only with no separate code. Confirm there is no code to add."}];
