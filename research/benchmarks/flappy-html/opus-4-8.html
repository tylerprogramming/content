<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  #game {
    display: block;
    background: #70c5ce;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    touch-action: manipulation;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Tunables
  const GRAVITY = 0.45;
  const FLAP = -8;
  const PIPE_W = 60;
  const GAP = 160;
  const PIPE_SPEED = 2.4;
  const PIPE_INTERVAL = 100; // frames between spawns
  const GROUND_H = 80;

  // States: 'ready' | 'playing' | 'over'
  let state, bird, pipes, frame, score, best = 0;

  function reset() {
    state = 'ready';
    bird = { x: 90, y: H / 2, vy: 0, r: 14, rot: 0 };
    pipes = [];
    frame = 0;
    score = 0;
  }

  function flap() {
    if (state === 'ready') {
      state = 'playing';
      bird.vy = FLAP;
    } else if (state === 'playing') {
      bird.vy = FLAP;
    } else if (state === 'over') {
      reset();
    }
  }

  function spawnPipe() {
    const margin = 60;
    const minTop = margin;
    const maxTop = H - GROUND_H - GAP - margin;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W, top, bottom: top + GAP, passed: false });
  }

  function update() {
    if (state !== 'playing') return;
    frame++;

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 12));

    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > 0);

    // Collision with ground / ceiling
    if (bird.y + bird.r >= H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      gameOver();
      return;
    }
    if (bird.y - bird.r <= 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }

    // Collision with pipes
    for (const p of pipes) {
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
        if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) {
          gameOver();
          return;
        }
      }
    }
  }

  function gameOver() {
    state = 'over';
    best = Math.max(best, score);
  }

  // Drawing helpers
  function drawBackground() {
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, W, H - GROUND_H);
    // simple clouds
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 3; i++) {
      const cx = ((frame * 0.3 + i * 160) % (W + 120)) - 60;
      const cy = 80 + i * 90;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.arc(cx + 26, cy + 6, 18, 0, Math.PI * 2);
      ctx.arc(cx - 24, cy + 8, 16, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      ctx.fillStyle = '#5aab3f';
      ctx.strokeStyle = '#3f7d2c';
      ctx.lineWidth = 3;
      // top pipe
      ctx.fillRect(p.x, 0, PIPE_W, p.top);
      ctx.strokeRect(p.x, 0, PIPE_W, p.top);
      ctx.fillRect(p.x - 4, p.top - 22, PIPE_W + 8, 22);
      ctx.strokeRect(p.x - 4, p.top - 22, PIPE_W + 8, 22);
      // bottom pipe
      const bh = H - GROUND_H - p.bottom;
      ctx.fillRect(p.x, p.bottom, PIPE_W, bh);
      ctx.strokeRect(p.x, p.bottom, PIPE_W, bh);
      ctx.fillRect(p.x - 4, p.bottom, PIPE_W + 8, 22);
      ctx.strokeRect(p.x - 4, p.bottom, PIPE_W + 8, 22);
    }
  }

  function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#c0b56b';
    ctx.fillRect(0, H - GROUND_H, W, 10);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    // body
    ctx.fillStyle = '#f4d03f';
    ctx.strokeStyle = '#c49a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // wing
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-3, 2, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(8, -5, 2.4, 0, Math.PI * 2);
    ctx.fill();
    // beak
    ctx.fillStyle = '#e67e22';
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, -2);
    ctx.lineTo(bird.r + 8, 0);
    ctx.lineTo(bird.r - 2, 4);
    ctx.fill();
    ctx.restore();
  }

  function drawText(text, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(text, W / 2, y);
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();

    // Score during play
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 4;
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px -apple-system, system-ui, sans-serif';
    if (state === 'playing' || state === 'ready') {
      ctx.strokeText(score, W / 2, 70);
      ctx.fillStyle = '#fff';
      ctx.fillText(score, W / 2, 70);
    }

    if (state === 'ready') {
      drawText('Flappy Bird', H / 2 - 60, 34, '#fff');
      drawText('Tap or press Space to flap', H / 2 - 20, 16, '#fff');
    }

    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      drawText('Game Over', H / 2 - 70, 40, '#fff');
      drawText('Score: ' + score, H / 2 - 20, 24, '#fff');
      drawText('Best: ' + best, H / 2 + 14, 20, '#f4d03f');
      drawText('Tap or press Space to restart', H / 2 + 70, 16, '#fff');
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Input
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      flap();
    }
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); flap(); });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

  reset();
  loop();
})();
</script>
</body>
</html>
