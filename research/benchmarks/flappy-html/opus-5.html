<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#1b2430;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  canvas {
    display:block;
    height:min(96vh, 720px);
    max-width:96vw;
    aspect-ratio:400 / 600;
    border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    cursor:pointer;
    touch-action:manipulation;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const W = 400, H = 600;
  const GROUND_Y = 510;
  const GROUND_H = H - GROUND_Y;

  const GRAVITY    = 1800;   // px/s^2
  const FLAP_V     = -480;   // px/s
  const MAX_FALL   = 700;
  const PIPE_SPEED = 155;    // px/s
  const PIPE_W     = 70;
  const PIPE_GAP   = 155;
  const PIPE_EVERY = 1.55;   // seconds
  const CAP_H      = 28;
  const BIRD_X     = 110;
  const BIRD_R     = 13;
  const RESTART_LOCK = 0.45; // seconds before a restart input is accepted

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- state ----------
  let state, bird, pipes, clouds, score, best, spawnTimer, groundX, cloudX,
      overTimer, flapAnim, scorePop, flash, shake, t;

  try { best = parseInt(localStorage.getItem('flappyBest') || '0', 10) || 0; }
  catch (e) { best = 0; }

  function reset() {
    state = 'ready';
    bird = { y: 260, vy: 0, rot: 0 };
    pipes = [];
    score = 0;
    spawnTimer = 0;
    overTimer = 0;
    flapAnim = 0;
    scorePop = 0;
    flash = 0;
    shake = 0;
    t = 0;
    groundX = 0;
    cloudX = 0;
    clouds = [
      { x:  60, y:  80, s: 1.0 },
      { x: 210, y: 140, s: 0.7 },
      { x: 330, y:  60, s: 0.85 },
      { x: 150, y: 210, s: 0.6 }
    ];
  }

  function spawnPipe() {
    const margin = 70;
    const min = margin;
    const max = GROUND_Y - PIPE_GAP - margin;
    const gapY = min + Math.random() * (max - min);
    pipes.push({ x: W + 10, gapY, scored: false });
  }

  // ---------- input ----------
  function flap() {
    if (state === 'ready') {
      state = 'playing';
      bird.vy = FLAP_V;
      flapAnim = 1;
    } else if (state === 'playing') {
      bird.vy = FLAP_V;
      flapAnim = 1;
    } else if (state === 'over' && overTimer > RESTART_LOCK) {
      reset();
      state = 'playing';
      bird.vy = FLAP_V;
      flapAnim = 1;
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  }, { passive: false });

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  // ---------- collision ----------
  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    state = 'over';
    overTimer = 0;
    flash = 1;
    shake = 1;
    if (score > best) {
      best = score;
      try { localStorage.setItem('flappyBest', String(best)); } catch (e) {}
    }
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    flapAnim = Math.max(0, flapAnim - dt * 4);
    scorePop = Math.max(0, scorePop - dt * 4);
    flash    = Math.max(0, flash - dt * 3);
    shake    = Math.max(0, shake - dt * 4);

    cloudX = (cloudX + dt * 14) % 1000;

    if (state === 'ready') {
      bird.y = 260 + Math.sin(t * 3) * 8;
      bird.rot = Math.sin(t * 3) * 0.12;
      groundX = (groundX + PIPE_SPEED * dt) % 40;
      return;
    }

    if (state === 'playing') groundX = (groundX + PIPE_SPEED * dt) % 40;

    // bird physics (keeps falling after death until it lands)
    bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
    bird.y += bird.vy * dt;

    const target = Math.max(-0.5, Math.min(1.45, bird.vy / 520));
    bird.rot += (target - bird.rot) * Math.min(1, dt * 9);

    if (state === 'over') {
      overTimer += dt;
      if (bird.y > GROUND_Y - BIRD_R) {
        bird.y = GROUND_Y - BIRD_R;
        bird.vy = 0;
      }
      return;
    }

    // ceiling
    if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = 0; }

    // pipes
    spawnTimer += dt;
    if (spawnTimer >= PIPE_EVERY) { spawnTimer -= PIPE_EVERY; spawnPipe(); }

    for (const p of pipes) {
      p.x -= PIPE_SPEED * dt;
      if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R) {
        p.scored = true;
        score++;
        scorePop = 1;
      }
    }
    while (pipes.length && pipes[0].x + PIPE_W < -20) pipes.shift();

    // ground
    if (bird.y + BIRD_R >= GROUND_Y) {
      bird.y = GROUND_Y - BIRD_R;
      die();
      return;
    }

    // pipe collision
    for (const p of pipes) {
      if (p.x > BIRD_X + BIRD_R || p.x + PIPE_W < BIRD_X - BIRD_R) continue;
      if (circleHitsRect(BIRD_X, bird.y, BIRD_R - 1, p.x, 0, PIPE_W, p.gapY) ||
          circleHitsRect(BIRD_X, bird.y, BIRD_R - 1, p.x, p.gapY + PIPE_GAP, PIPE_W, GROUND_Y - (p.gapY + PIPE_GAP))) {
        die();
        return;
      }
    }
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y + 6 * s, 15 * s, 0, Math.PI * 2);
    ctx.arc(x - 22 * s, y + 7 * s, 13 * s, 0, Math.PI * 2);
    ctx.arc(x + 6 * s, y - 12 * s, 14 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#4ec0ec');
    sky.addColorStop(0.65, '#8fd8f2');
    sky.addColorStop(1, '#cdeeda');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GROUND_Y);

    for (const c of clouds) {
      let x = c.x - cloudX * c.s;
      x = ((x % (W + 140)) + (W + 140)) % (W + 140) - 70;
      drawCloud(x, c.y, c.s);
    }

    // distant hills
    ctx.fillStyle = 'rgba(108,192,140,.55)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, GROUND_Y - 40 - Math.sin((x + cloudX * 0.4) * 0.018) * 22);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  function drawPipe(p) {
    const bottomY = p.gapY + PIPE_GAP;
    const body = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    body.addColorStop(0,    '#4a9b30');
    body.addColorStop(0.25, '#8ed46a');
    body.addColorStop(0.6,  '#5cb43c');
    body.addColorStop(1,    '#357322');

    const draw = (y, h) => {
      ctx.fillStyle = body;
      ctx.fillRect(p.x, y, PIPE_W, h);
      ctx.strokeStyle = 'rgba(28,68,20,.85)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 1, y + 1, PIPE_W - 2, h - 2);
    };
    const cap = y => {
      ctx.fillStyle = body;
      ctx.fillRect(p.x - 5, y, PIPE_W + 10, CAP_H);
      ctx.strokeStyle = 'rgba(28,68,20,.85)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 4, y + 1, PIPE_W + 8, CAP_H - 2);
    };

    draw(0, p.gapY - CAP_H);
    cap(p.gapY - CAP_H);
    draw(bottomY + CAP_H, GROUND_Y - bottomY - CAP_H);
    cap(bottomY);
  }

  function drawGround() {
    ctx.fillStyle = '#ded093';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    ctx.fillStyle = '#7ec850';
    ctx.fillRect(0, GROUND_Y, W, 14);
    ctx.fillStyle = '#5aa832';
    for (let x = -groundX; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 14);
      ctx.lineTo(x + 20, GROUND_Y + 14);
      ctx.lineTo(x + 10, GROUND_Y + 22);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(190,172,110,.6)';
    for (let x = -groundX * 0.6; x < W; x += 30) {
      ctx.fillRect(x, GROUND_Y + 34, 16, 5);
      ctx.fillRect(x + 12, GROUND_Y + 52, 20, 5);
    }
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.fillRect(0, GROUND_Y, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);

    // body
    const g = ctx.createLinearGradient(0, -14, 0, 14);
    g.addColorStop(0, '#ffe066');
    g.addColorStop(1, '#f0a92c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,10,.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // tail
    ctx.fillStyle = '#e29a24';
    ctx.beginPath();
    ctx.moveTo(-13, -3);
    ctx.lineTo(-24, -9);
    ctx.lineTo(-22, 4);
    ctx.closePath();
    ctx.fill();

    // wing
    const wing = state === 'playing' || state === 'ready'
      ? Math.sin(t * 14) * 4 - flapAnim * 8
      : 6;
    ctx.fillStyle = '#fff4cf';
    ctx.beginPath();
    ctx.ellipse(-2, 2 + wing * 0.5, 9, 6 - wing * 0.25, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,10,.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#22303c';
    ctx.beginPath();
    ctx.arc(state === 'over' ? 8 : 9, -5, 2.6, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#f5673a';
    ctx.beginPath();
    ctx.moveTo(13, -1);
    ctx.lineTo(25, 2);
    ctx.lineTo(13, 6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawScore() {
    const s = 1 + scorePop * 0.25;
    ctx.save();
    ctx.translate(W / 2, 92);
    ctx.scale(s, s);
    ctx.font = 'bold 54px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(30,45,60,.85)';
    ctx.strokeText(score, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillText(score, 0, 0);
    ctx.restore();
  }

  function centerText(text, y, size, color, weight) {
    ctx.font = `${weight || 'bold'} ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(20,35,50,.28)';
    roundRect(W / 2 - 130, 160, 260, 96, 16);
    ctx.fill();
    centerText('FLAPPY BIRD', 196, 30, '#fff');
    centerText('Space or click to flap', 228, 15, 'rgba(255,255,255,.9)', '600');

    ctx.globalAlpha = 0.55 + Math.sin(t * 4) * 0.35;
    centerText('▲', 340, 26, '#fff');
    ctx.globalAlpha = 1;
  }

  function drawGameOver() {
    const appear = Math.min(1, overTimer * 3.5);
    const ease = 1 - Math.pow(1 - appear, 3);

    ctx.fillStyle = `rgba(12,22,34,${0.5 * ease})`;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, 250 - (1 - ease) * 30);
    ctx.globalAlpha = ease;

    ctx.fillStyle = 'rgba(255,255,255,.96)';
    roundRect(-140, -100, 280, 210, 20);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,50,70,.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#e0603a';
    ctx.font = 'bold 30px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('GAME OVER', 0, -62);

    ctx.fillStyle = '#7b8794';
    ctx.font = 'bold 13px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('SCORE', -62, -14);
    ctx.fillText('BEST', 62, -14);

    ctx.fillStyle = '#22303c';
    ctx.font = 'bold 40px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(score, -62, 18);
    ctx.fillText(best, 62, 18);

    if (score >= best && score > 0) {
      ctx.fillStyle = '#f0a92c';
      ctx.font = 'bold 12px -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('★ NEW BEST', 62, 46);
    }

    const ready = overTimer > RESTART_LOCK;
    ctx.globalAlpha = ease * (ready ? 0.6 + Math.sin(t * 5) * 0.4 : 0.3);
    ctx.fillStyle = '#3d8bd4';
    ctx.font = 'bold 15px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('Space or click to restart', 0, 84);

    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    }

    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();

    ctx.restore();

    if (state !== 'over') drawScore();
    if (state === 'ready') drawReady();
    if (state === 'over') drawGameOver();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  let last = 0;
  function frame(now) {
    if (!last) last = now;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</html>
