<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 13px/1.5 -apple-system, system-ui, sans-serif;
      color: #cfd8ff; user-select: none; pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
    #info b { color: #fff; }
  </style>
</head>
<body>
  <div id="info">
    <b>Solar System</b><br />
    drag to orbit &middot; scroll to zoom &middot; right-drag to pan
  </div>

  <!-- three.js + OrbitControls from CDN via import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---- Renderer ----
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---- Scene & camera ----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      55, window.innerWidth / window.innerHeight, 0.1, 2000
    );
    camera.position.set(0, 60, 130);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 20;
    controls.maxDistance = 600;

    // ---- Starfield background ----
    (function addStars() {
      const count = 3000;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        // spread stars on a big sphere shell
        const r = 700 + Math.random() * 600;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: true });
      scene.add(new THREE.Points(geo, mat));
    })();

    // ---- Lighting ----
    // Point light lives inside the sun; ambient keeps far sides faintly visible.
    scene.add(new THREE.PointLight(0xffffff, 2.2, 0, 0.0));
    scene.add(new THREE.AmbientLight(0x222233, 1));

    // ---- Sun ----
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(10, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffcc33 })
    );
    scene.add(sun);
    // soft glow sprite around the sun
    sun.add(new THREE.PointLight(0xffcc66, 1.2, 0));

    // ---- Planets ----
    // { name, size, distance, color, speed (orbital ang. velocity), spin }
    const planetData = [
      { name: 'Mercury', size: 1.2, distance: 18, color: 0xa9a9a9, speed: 1.60, spin: 0.02 },
      { name: 'Venus',   size: 2.2, distance: 26, color: 0xe8b06b, speed: 1.18, spin: 0.015 },
      { name: 'Earth',   size: 2.4, distance: 36, color: 0x4b8dfc, speed: 1.00, spin: 0.03 },
      { name: 'Mars',    size: 1.7, distance: 46, color: 0xdf6b4a, speed: 0.80, spin: 0.028 },
      { name: 'Jupiter', size: 5.6, distance: 64, color: 0xd9a06b, speed: 0.43, spin: 0.05 },
      { name: 'Saturn',  size: 4.8, distance: 84, color: 0xe6d3a3, speed: 0.32, spin: 0.045, ring: [6, 9] },
      { name: 'Uranus',  size: 3.4, distance: 102, color: 0x8fd6e0, speed: 0.23, spin: 0.03 },
      { name: 'Neptune', size: 3.3, distance: 118, color: 0x466ff0, speed: 0.18, spin: 0.03 },
    ];

    const planets = [];

    for (const p of planetData) {
      // Orbit pivot: rotating this spins the planet around the sun.
      const pivot = new THREE.Object3D();
      scene.add(pivot);

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 32, 32),
        new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.1 })
      );
      mesh.position.x = p.distance;
      pivot.add(mesh);

      // Saturn's ring
      if (p.ring) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.ring[0], p.ring[1], 64),
          new THREE.MeshBasicMaterial({
            color: 0xd8c89a, side: THREE.DoubleSide, transparent: true, opacity: 0.7
          })
        );
        ring.rotation.x = -Math.PI / 2.2;
        mesh.add(ring);
      }

      // Faint orbit path ring
      const orbit = new THREE.Mesh(
        new THREE.RingGeometry(p.distance - 0.05, p.distance + 0.05, 128),
        new THREE.MeshBasicMaterial({ color: 0x334466, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
      );
      orbit.rotation.x = -Math.PI / 2;
      scene.add(orbit);

      // Random start angle so they don't all line up.
      pivot.rotation.y = Math.random() * Math.PI * 2;

      planets.push({ pivot, mesh, speed: p.speed, spin: p.spin });
    }

    // ---- Animation loop ----
    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();
      sun.rotation.y += 0.05 * dt;

      for (const pl of planets) {
        pl.pivot.rotation.y += pl.speed * 0.4 * dt; // orbit
        pl.mesh.rotation.y += pl.spin;              // self-spin
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // ---- Resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
