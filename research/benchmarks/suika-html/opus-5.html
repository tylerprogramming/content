<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Suika — Watermelon Merge</title>
<style>
  :root{
    --bg0:#141024; --bg1:#241a3d; --panel:rgba(255,255,255,.07);
    --ink:#f4eefc; --dim:#a99bc7; --accent:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#33235c 0%,var(--bg1) 40%,var(--bg0) 100%);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Trebuchet MS",sans-serif;
    overflow:hidden; user-select:none;
  }
  #app{display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px}

  .hud{
    display:flex; align-items:center; gap:10px; width:100%;
  }
  .card{
    background:var(--panel); border:1px solid rgba(255,255,255,.09);
    border-radius:14px; padding:8px 14px; backdrop-filter:blur(6px);
  }
  .stat{flex:1; display:flex; flex-direction:column; align-items:center; line-height:1.05}
  .stat span{font-size:10px; letter-spacing:.18em; color:var(--dim); font-weight:700}
  .stat b{font-size:26px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .stat.best b{font-size:20px; color:var(--accent)}
  .nextbox{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px}
  .nextbox span{font-size:10px; letter-spacing:.18em; color:var(--dim); font-weight:700}
  #next{width:52px; height:52px; display:block}

  .stage{
    position:relative; aspect-ratio:500/700; height:min(700px,72vh); max-width:96vw;
    filter:drop-shadow(0 22px 45px rgba(0,0,0,.55));
  }
  #c{width:100%; height:100%; display:block; border-radius:20px; touch-action:none; cursor:pointer}

  #over{
    position:absolute; inset:0; display:none; place-items:center; text-align:center;
    background:rgba(12,8,24,.78); backdrop-filter:blur(5px); border-radius:20px;
  }
  #over.show{display:grid; animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #over h1{margin:0 0 4px; font-size:34px; letter-spacing:-.02em}
  #over .fin{font-size:52px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1}
  #over .sub{color:var(--dim); font-size:13px; margin-top:6px}
  button.btn{
    margin-top:18px; border:0; border-radius:999px; padding:13px 32px; cursor:pointer;
    font-size:16px; font-weight:800; letter-spacing:.02em; color:#2a1b06;
    background:linear-gradient(180deg,#ffe08a,#ffbd3f); box-shadow:0 8px 22px rgba(255,190,70,.35);
  }
  button.btn:active{transform:translateY(1px)}

  .chain{display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; max-width:520px}
  .chip{border-radius:50%; opacity:.22; transition:opacity .3s, transform .3s; box-shadow:inset 0 -2px 4px rgba(0,0,0,.3)}
  .chip.on{opacity:1; transform:scale(1)}
  .hint{font-size:11px; color:var(--dim); letter-spacing:.06em}
  .hint b{color:var(--ink)}
  .mute{
    position:absolute; top:10px; right:10px; z-index:5; width:32px; height:32px; border-radius:10px;
    border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.28); color:#fff; cursor:pointer; font-size:15px;
  }
  @media (max-height:720px){ .stat b{font-size:20px} .stage{height:66vh} }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="card stat"><span>SCORE</span><b id="score">0</b></div>
    <div class="card nextbox"><span>NEXT</span><canvas id="next" width="104" height="104"></canvas></div>
    <div class="card stat best"><span>BEST</span><b id="best">0</b></div>
  </div>

  <div class="stage">
    <canvas id="c"></canvas>
    <button class="mute" id="mute" title="Sound">&#128266;</button>
    <div id="over">
      <div>
        <h1>Game Over</h1>
        <div class="fin" id="finalScore">0</div>
        <div class="sub" id="finalSub">The pile got too tall</div>
        <button class="btn" id="again">Play Again</button>
      </div>
    </div>
  </div>

  <div class="chain" id="chain"></div>
  <div class="hint">Move to aim &nbsp;·&nbsp; <b>Click</b> or <b>Space</b> to drop &nbsp;·&nbsp; merge two of the same fruit</div>
</div>

<script>
(() => {
"use strict";

/* ─────────────── constants ─────────────── */
const W = 500, H = 700;
const LEFT = 18, RIGHT = W - 18, FLOOR = H - 18;
const DANGER_Y = 132;          // overflow line
const DROP_Y   = 66;           // where the held fruit sits
const GRAV     = 2000;
const SUB = 6, ITER = 4;       // substeps / solver iterations
const REST = 0.05, FRIC = 0.42;
const WALL_REST = 0.12, WALL_FRIC = 0.5;
const TAU = Math.PI * 2;
const DROP_COOLDOWN = 0.4;
const OVERFLOW_LIMIT = 2.2;

const FRUITS = [
  { n:'Cherry',     r:14,  c:'#d1394b', s:'stem'   },
  { n:'Strawberry', r:20,  c:'#ff7a8a', s:'seeds'  },
  { n:'Grape',      r:27,  c:'#8e5bd8', s:'stem'   },
  { n:'Dekopon',    r:33,  c:'#f7b32b', s:'citrus' },
  { n:'Orange',     r:40,  c:'#f0822a', s:'citrus' },
  { n:'Apple',      r:48,  c:'#e5453c', s:'stem'   },
  { n:'Pear',       r:57,  c:'#c3d24a', s:'stem'   },
  { n:'Peach',      r:66,  c:'#ff9bb3', s:'stem'   },
  { n:'Pineapple',  r:76,  c:'#f4d641', s:'pine'   },
  { n:'Melon',      r:88,  c:'#8ed35f', s:'net'    },
  { n:'Watermelon', r:100, c:'#3fae5a', s:'melon'  },
];
const MAXT = FRUITS.length - 1;
// merging two of type i scores the i-th triangular number
const TRI = FRUITS.map((_, i) => ((i + 1) * (i + 2)) / 2);
const SPAWNABLE = [0, 0, 0, 1, 1, 1, 2, 2, 3, 4];

/* ─────────────── canvas ─────────────── */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const nextCv = document.getElementById('next');
const nctx = nextCv.getContext('2d');
let dpr = 1;
function sizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);

/* ─────────────── colour helpers ─────────────── */
const hexCache = {};
function rgb(hex){
  if (hexCache[hex]) return hexCache[hex];
  const v = parseInt(hex.slice(1), 16);
  return (hexCache[hex] = [(v >> 16) & 255, (v >> 8) & 255, v & 255]);
}
function mix(hex, target, amt){
  const [r, g, b] = rgb(hex);
  const t = target ? 255 : 0;
  return `rgb(${Math.round(r + (t - r) * amt)},${Math.round(g + (t - g) * amt)},${Math.round(b + (t - b) * amt)})`;
}
const lighten = (h, a) => mix(h, true, a);
const darken  = (h, a) => mix(h, false, a);
function rgba(hex, a){ const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }

/* ─────────────── audio (tiny synth, no assets) ─────────────── */
let actx = null, muted = false;
function audio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo){
  if (muted) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.03);
}
const sfxDrop  = () => tone(220, 0.09, 'triangle', 0.14, 150);
const sfxMerge = t => {
  const f = 300 * Math.pow(1.14, MAXT - t);
  tone(f, 0.16, 'sine', 0.2, f * 1.6);
  tone(f * 2, 0.1, 'triangle', 0.07);
};
const sfxBig = () => { [0,90,180,300].forEach((d,i)=>setTimeout(()=>tone(440*Math.pow(1.26,i),0.3,'sine',0.22,880*Math.pow(1.26,i)),d)); };
const sfxOver = () => { tone(300, 0.7, 'sawtooth', 0.16, 70); };

/* ─────────────── game state ─────────────── */
let bodies = [], particles = [], rings = [], texts = [];
let pairs = [];
let score = 0, best = +(localStorage.getItem('suika-best') || 0);
let held = null, nextType = pick(), cooldown = 0;
let aimX = W / 2, shake = 0, gameOver = false, T = 0;
let combo = 0, lastMerge = -9, warn = 0;
const discovered = new Set();
let idc = 0;

function pick(){ return SPAWNABLE[(Math.random() * SPAWNABLE.length) | 0]; }

function makeFruit(type, x, y, vx, vy){
  const F = FRUITS[type];
  const m = F.r * F.r * 0.01;
  discovered.add(type); paintChain();
  return {
    id: idc++, type, x, y, r: F.r, m, im: 1 / m,
    vx: vx || 0, vy: vy || 0,
    ang: Math.random() * TAU, av: (Math.random() - 0.5) * 0.6,
    age: 0, over: 0, pop: 1, dead: false,
  };
}

function reset(){
  bodies = []; particles = []; rings = []; texts = [];
  score = 0; combo = 0; lastMerge = -9; shake = 0; warn = 0;
  cooldown = 0.25; gameOver = false; T = 0;
  held = null; nextType = pick();
  discovered.clear();
  document.getElementById('over').classList.remove('show');
  updateHud(); paintChain();
}

/* ─────────────── physics ─────────────── */
function broadphase(){
  pairs.length = 0;
  const list = bodies.slice().sort((a, b) => (a.x - a.r) - (b.x - b.r));
  const M = 4;
  for (let i = 0; i < list.length; i++){
    const a = list[i], aMax = a.x + a.r + M;
    for (let j = i + 1; j < list.length; j++){
      const b = list[j];
      if (b.x - b.r > aMax) break;
      if (Math.abs(a.y - b.y) > a.r + b.r + M) continue;
      pairs.push(a, b);
    }
  }
}

function solvePairs(){
  for (let i = 0; i < pairs.length; i += 2){
    const a = pairs[i], b = pairs[i + 1];
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    const minD = a.r + b.r;
    if (d2 >= minD * minD) continue;
    let d = Math.sqrt(d2);
    let nx, ny;
    if (d < 0.0001){ nx = 0; ny = -1; d = 0.0001; } else { nx = dx / d; ny = dy / d; }

    // positional separation
    const pen = Math.max(minD - d - 0.4, 0) * 0.85;
    const invSum = a.im + b.im;
    if (pen > 0){
      const ca = pen * (a.im / invSum), cb = pen * (b.im / invSum);
      a.x -= nx * ca; a.y -= ny * ca;
      b.x += nx * cb; b.y += ny * cb;
    }

    // normal impulse
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn > 0) continue;
    const jn = -(1 + REST) * vn / invSum;
    a.vx -= jn * nx * a.im; a.vy -= jn * ny * a.im;
    b.vx += jn * nx * b.im; b.vy += jn * ny * b.im;

    // tangential (friction) impulse + spin
    const tx = -ny, ty = nx;
    const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
    let jt = -vt / invSum;
    const lim = FRIC * Math.abs(jn);
    if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im;
    b.vx += jt * tx * b.im; b.vy += jt * ty * b.im;
    a.av -= 2 * jt * a.im / a.r;
    b.av -= 2 * jt * b.im / b.r;
  }
}

function wallHit(f, nx, ny, pen){
  f.x += nx * pen; f.y += ny * pen;
  const vn = f.vx * nx + f.vy * ny;
  if (vn > 0) return;
  const jn = -(1 + WALL_REST) * vn;
  f.vx += jn * nx; f.vy += jn * ny;
  const tx = -ny, ty = nx;
  const vt = f.vx * tx + f.vy * ty;
  let jt = -vt;
  const lim = WALL_FRIC * Math.abs(jn);
  if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
  f.vx += jt * tx; f.vy += jt * ty;
  f.av -= 2 * jt / f.r;
}

function solveWalls(){
  for (const f of bodies){
    if (f.x - f.r < LEFT)  wallHit(f,  1, 0, LEFT - (f.x - f.r));
    if (f.x + f.r > RIGHT) wallHit(f, -1, 0, (f.x + f.r) - RIGHT);
    if (f.y + f.r > FLOOR) wallHit(f, 0, -1, (f.y + f.r) - FLOOR);
  }
}

function step(dt){
  const h = dt / SUB;
  for (let s = 0; s < SUB; s++){
    for (const f of bodies){
      f.vy += GRAV * h;
      f.vx *= 0.9992; f.vy *= 0.9992;
      const sp = Math.hypot(f.vx, f.vy);
      if (sp > 2600){ f.vx *= 2600 / sp; f.vy *= 2600 / sp; }
      f.x += f.vx * h; f.y += f.vy * h;
      f.av *= 0.985;
      if (f.av > 14) f.av = 14; else if (f.av < -14) f.av = -14;
      f.ang += f.av * h;
    }
    broadphase();
    for (let k = 0; k < ITER; k++){ solvePairs(); solveWalls(); }
    resolveMerges();
  }
}

/* ─────────────── merging ─────────────── */
function resolveMerges(){
  let any = false;
  for (let i = 0; i < pairs.length; i += 2){
    const a = pairs[i], b = pairs[i + 1];
    if (a.dead || b.dead || a.type !== b.type) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const md = a.r + b.r + 1.5;
    if (dx * dx + dy * dy > md * md) continue;
    a.dead = b.dead = true; any = true;
    doMerge(a, b);
  }
  if (any) bodies = bodies.filter(f => !f.dead);
}

function doMerge(a, b){
  const t = a.type;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const col = FRUITS[t].c;

  combo = (T - lastMerge < 1.2) ? combo + 1 : 1;
  lastMerge = T;
  const mult = Math.min(1 + 0.5 * (combo - 1), 3);
  let pts = Math.round(TRI[t] * mult);

  if (t < MAXT){
    const nf = makeFruit(t + 1, mx, my, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - 40);
    nf.pop = 0; nf.age = 0;
    bodies.push(nf);
    burst(mx, my, FRUITS[t + 1].c, 10 + t, 1 + t * 0.12);
    rings.push({ x: mx, y: my, r: FRUITS[t].r, max: FRUITS[t + 1].r * 2.1, life: 1, c: FRUITS[t + 1].c });
    shake = Math.min(shake + 1.5 + t * 0.9, 16);
    sfxMerge(t);
  } else {
    pts += 800;
    burst(mx, my, col, 60, 2.4);
    rings.push({ x: mx, y: my, r: 40, max: 320, life: 1, c: '#ffe27a' });
    shake = 22;
    texts.push({ x: mx, y: my - 60, t: 'WATERMELON!', life: 1.6, c: '#ffe27a', sz: 26 });
    sfxBig();
  }

  score += pts;
  texts.push({ x: mx, y: my, t: '+' + pts, life: 1, c: lighten(col, 0.5), sz: 16 + t * 1.4 });
  if (combo >= 2) texts.push({ x: mx, y: my - 26, t: 'COMBO x' + combo, life: 1.1, c: '#ffd166', sz: 15 });
  updateHud();
}

function burst(x, y, col, n, sc){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, sp = (90 + Math.random() * 260) * sc;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      r: (2 + Math.random() * 5) * sc, life: 0.5 + Math.random() * 0.5, max: 1, c: col,
    });
  }
}

/* ─────────────── dropping ─────────────── */
function clampAim(r){ return Math.max(LEFT + r + 1, Math.min(RIGHT - r - 1, aimX)); }

function ensureHeld(){
  if (held || gameOver || cooldown > 0) return;
  held = { type: nextType, bob: 0 };
  nextType = pick();
  drawNext();
}

function drop(){
  if (gameOver || !held) return;
  const r = FRUITS[held.type].r;
  const f = makeFruit(held.type, clampAim(r), DROP_Y, 0, 60);
  bodies.push(f);
  held = null; cooldown = DROP_COOLDOWN;
  sfxDrop();
}

/* ─────────────── overflow / game over ─────────────── */
function checkOverflow(dt){
  let worst = 0;
  for (const f of bodies){
    if (f.age > 0.8 && f.y - f.r < DANGER_Y) f.over += dt;
    else f.over = Math.max(0, f.over - dt * 2.5);
    if (f.over > worst) worst = f.over;
  }
  warn = worst;
  if (worst > OVERFLOW_LIMIT) endGame();
}

function endGame(){
  if (gameOver) return;
  gameOver = true; held = null;
  sfxOver();
  if (score > best){ best = score; localStorage.setItem('suika-best', best); }
  updateHud();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalSub').textContent =
    discovered.has(MAXT) ? 'You made a watermelon. Legend.' : 'The pile reached the line';
  document.getElementById('over').classList.add('show');
}

/* ─────────────── update ─────────────── */
function update(dt){
  T += dt;
  if (!gameOver){
    step(dt);
    for (const f of bodies){ f.age += dt; if (f.pop < 1) f.pop = Math.min(1, f.pop + dt / 0.22); }
    checkOverflow(dt);
    if (cooldown > 0) cooldown -= dt;
    ensureHeld();
    if (held) held.bob += dt;
    if (T - lastMerge > 1.2) combo = 0;
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.985; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i]; r.life -= dt * 2.2;
    r.r += (r.max - r.r) * Math.min(1, dt * 9);
    if (r.life <= 0) rings.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i]; t.life -= dt; t.y -= 34 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
  shake *= Math.pow(0.02, dt);
  if (shake < 0.15) shake = 0;
}

/* ─────────────── drawing ─────────────── */
function easeOutBack(t){ const c1 = 1.70158, c3 = c1 + 1; const p = t - 1; return 1 + c3 * p * p * p + c1 * p * p; }

function drawFruit(g, f, cx, cy, scale){
  const S = FRUITS[f.type];
  const r = S.r * scale;
  const pop = f.pop >= 1 ? 1 : 0.55 + 0.45 * easeOutBack(f.pop);

  g.save();
  g.translate(cx, cy);
  g.rotate(f.ang);
  g.scale(pop, pop);

  // body
  const grd = g.createRadialGradient(-r * 0.34, -r * 0.4, r * 0.08, 0, 0, r * 1.05);
  grd.addColorStop(0, lighten(S.c, 0.5));
  grd.addColorStop(0.55, S.c);
  grd.addColorStop(1, darken(S.c, 0.28));
  g.beginPath(); g.arc(0, 0, r, 0, TAU);
  g.fillStyle = grd; g.fill();

  // surface detail (clipped)
  g.save(); g.clip();
  const d = S.s;
  if (d === 'melon'){
    g.strokeStyle = 'rgba(18,72,38,.6)'; g.lineWidth = r * 0.14; g.lineCap = 'round';
    for (let k = -2; k <= 2; k++){
      g.beginPath();
      g.moveTo(k * r * 0.46 - r * 0.1, -r * 1.15);
      g.quadraticCurveTo(k * r * 0.66, 0, k * r * 0.46 - r * 0.1, r * 1.15);
      g.stroke();
    }
  } else if (d === 'net'){
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = r * 0.045;
    for (let k = -4; k <= 4; k++){
      g.beginPath(); g.moveTo(k * r * 0.3 - r, -r * 1.2); g.lineTo(k * r * 0.3 + r, r * 1.2); g.stroke();
      g.beginPath(); g.moveTo(k * r * 0.3 - r, r * 1.2);  g.lineTo(k * r * 0.3 + r, -r * 1.2); g.stroke();
    }
  } else if (d === 'pine'){
    g.strokeStyle = 'rgba(120,70,10,.28)'; g.lineWidth = r * 0.06;
    for (let k = -4; k <= 4; k++){
      g.beginPath(); g.moveTo(k * r * 0.34 - r, -r * 1.2); g.lineTo(k * r * 0.34 + r, r * 1.2); g.stroke();
      g.beginPath(); g.moveTo(k * r * 0.34 - r, r * 1.2);  g.lineTo(k * r * 0.34 + r, -r * 1.2); g.stroke();
    }
  } else if (d === 'citrus'){
    g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = r * 0.055;
    for (let k = 0; k < 10; k++){
      const a = (k / 10) * TAU;
      g.beginPath(); g.moveTo(Math.cos(a) * r * 0.25, Math.sin(a) * r * 0.25);
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r); g.stroke();
    }
  } else if (d === 'seeds'){
    g.fillStyle = 'rgba(255,240,180,.9)';
    for (let k = 0; k < 9; k++){
      const a = k * 2.4, rad = r * (0.3 + ((k * 37) % 60) / 100);
      g.save(); g.translate(Math.cos(a) * rad, Math.sin(a) * rad); g.rotate(a);
      g.beginPath(); g.ellipse(0, 0, r * 0.075, r * 0.045, 0, 0, TAU); g.fill(); g.restore();
    }
  }
  g.restore();

  // specular highlight
  g.save();
  g.beginPath(); g.ellipse(-r * 0.36, -r * 0.42, r * 0.3, r * 0.19, -0.7, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,.4)'; g.fill();
  g.restore();

  // rim
  g.beginPath(); g.arc(0, 0, r - 0.5, 0, TAU);
  g.strokeStyle = rgba(darken(S.c, 0.45).replace('rgb(', '#').slice(0, 1) === '#' ? S.c : S.c, 0.35);
  g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = Math.max(1.2, r * 0.05); g.stroke();

  // stem + leaf
  if (d === 'stem' || d === 'melon' || d === 'citrus'){
    g.strokeStyle = '#7a5230'; g.lineWidth = Math.max(1.6, r * 0.09); g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, -r * 0.92); g.quadraticCurveTo(r * 0.1, -r * 1.14, r * 0.02, -r * 1.24); g.stroke();
    g.fillStyle = '#5cb85c';
    g.beginPath(); g.ellipse(r * 0.28, -r * 1.05, r * 0.24, r * 0.12, -0.5, 0, TAU); g.fill();
  }
  if (d === 'pine'){
    g.fillStyle = '#4f9d3a';
    for (let k = -1; k <= 1; k++){
      g.save(); g.translate(0, -r * 0.9); g.rotate(k * 0.5);
      g.beginPath(); g.ellipse(0, -r * 0.22, r * 0.11, r * 0.3, 0, 0, TAU); g.fill(); g.restore();
    }
  }

  // face
  const ex = r * 0.31, ey = -r * 0.06, er = Math.max(1.6, r * 0.13);
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(-ex, ey, er, 0, TAU); g.fill();
  g.beginPath(); g.arc(ex, ey, er, 0, TAU); g.fill();
  g.fillStyle = '#33203a';
  g.beginPath(); g.arc(-ex + er * 0.12, ey + er * 0.1, er * 0.52, 0, TAU); g.fill();
  g.beginPath(); g.arc(ex + er * 0.12, ey + er * 0.1, er * 0.52, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(51,32,58,.85)'; g.lineWidth = Math.max(1.2, r * 0.055); g.lineCap = 'round';
  g.beginPath(); g.arc(0, r * 0.1, r * 0.24, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();

  g.restore();
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // jar interior
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2b2050'); bg.addColorStop(0.45, '#1d1636'); bg.addColorStop(1, '#150f28');
  roundRect(ctx, 4, 4, W - 8, H - 8, 20); ctx.fillStyle = bg; ctx.fill();

  // soft glow above the line
  const gl = ctx.createLinearGradient(0, 0, 0, DANGER_Y + 60);
  gl.addColorStop(0, 'rgba(255,255,255,.07)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(4, 4, W - 8, DANGER_Y + 60);

  // danger line
  const alert = Math.min(1, warn / OVERFLOW_LIMIT);
  const pulse = 0.28 + 0.5 * alert + (alert > 0.05 ? 0.22 * Math.sin(T * 14) * alert : 0);
  ctx.save();
  ctx.setLineDash([9, 9]); ctx.lineDashOffset = -T * 24;
  ctx.strokeStyle = `rgba(${255},${Math.round(180 - 140 * alert)},${Math.round(120 - 100 * alert)},${pulse})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(LEFT, DANGER_Y); ctx.lineTo(RIGHT, DANGER_Y); ctx.stroke();
  ctx.restore();
  if (alert > 0.15){
    const wg = ctx.createLinearGradient(0, DANGER_Y - 70, 0, DANGER_Y);
    wg.addColorStop(0, 'rgba(255,60,60,0)'); wg.addColorStop(1, `rgba(255,60,60,${0.3 * alert})`);
    ctx.fillStyle = wg; ctx.fillRect(LEFT, DANGER_Y - 70, RIGHT - LEFT, 70);
  }

  // aim guide + held fruit
  if (held && !gameOver){
    const r = FRUITS[held.type].r, x = clampAim(r);
    ctx.save();
    ctx.setLineDash([4, 10]); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, DROP_Y + r); ctx.lineTo(x, FLOOR); ctx.stroke();
    ctx.restore();
    const ghost = { type: held.type, ang: 0, pop: 1 };
    drawFruit(ctx, ghost, x, DROP_Y + Math.sin(held.bob * 4) * 3, 1);
  }

  // fruits
  for (const f of bodies) drawFruit(ctx, f, f.x, f.y, 1);

  // rings
  for (const r of rings){
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.strokeStyle = rgba(r.c, Math.max(0, r.life) * 0.55);
    ctx.lineWidth = 4 * Math.max(0, r.life); ctx.stroke();
  }
  // particles
  for (const p of particles){
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(0, p.life), 0, TAU);
    ctx.fillStyle = rgba(p.c, Math.min(1, p.life * 1.4)); ctx.fill();
  }
  // floating text
  ctx.textAlign = 'center';
  for (const t of texts){
    ctx.save();
    ctx.globalAlpha = Math.min(1, t.life * 1.6);
    ctx.font = `800 ${t.sz}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,6,20,.6)';
    ctx.strokeText(t.t, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.t, t.x, t.y);
    ctx.restore();
  }

  // walls
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 3;
  roundRect(ctx, 4, 4, W - 8, H - 8, 20); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(LEFT - 4, 4); ctx.lineTo(LEFT - 4, FLOOR + 4);
  ctx.lineTo(RIGHT + 4, FLOOR + 4); ctx.lineTo(RIGHT + 4, 4);
  ctx.stroke();

  ctx.restore();
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function drawNext(){
  const S = FRUITS[nextType];
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, 104, 104);
  nctx.save(); nctx.translate(52, 52);
  const sc = 42 / S.r;
  drawFruit(nctx, { type: nextType, ang: 0, pop: 1 }, 0, 0, sc);
  nctx.restore();
}

/* ─────────────── HUD ─────────────── */
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
function updateHud(){
  scoreEl.textContent = score;
  bestEl.textContent = Math.max(best, score);
}
const chainEl = document.getElementById('chain');
FRUITS.forEach((F, i) => {
  const d = document.createElement('div');
  d.className = 'chip';
  const s = 9 + i * 2.1;
  d.style.width = d.style.height = s + 'px';
  d.style.background = `radial-gradient(circle at 32% 28%, ${lighten(F.c, .45)}, ${F.c} 60%, ${darken(F.c, .25)})`;
  d.title = F.n;
  chainEl.appendChild(d);
});
function paintChain(){
  const chips = chainEl.children;
  for (let i = 0; i < chips.length; i++) chips[i].classList.toggle('on', discovered.has(i));
}

/* ─────────────── input ─────────────── */
function toLocal(e){
  const b = cv.getBoundingClientRect();
  return ((e.clientX - b.left) / b.width) * W;
}
cv.addEventListener('pointermove', e => { aimX = toLocal(e); });
cv.addEventListener('pointerdown', e => { audio(); aimX = toLocal(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', e => { aimX = toLocal(e); drop(); });
cv.addEventListener('pointerleave', () => {});
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  { aimX -= e.shiftKey ? 32 : 14; e.preventDefault(); }
  if (e.code === 'ArrowRight') { aimX += e.shiftKey ? 32 : 14; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault(); audio();
    if (gameOver) reset(); else drop();
  }
  if (e.key === 'r' || e.key === 'R') reset();
  aimX = Math.max(LEFT, Math.min(RIGHT, aimX));
});
document.getElementById('again').addEventListener('click', () => { audio(); reset(); });
document.getElementById('mute').addEventListener('click', ev => {
  muted = !muted;
  ev.currentTarget.innerHTML = muted ? '&#128263;' : '&#128266;';
});
window.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });

/* ─────────────── loop ─────────────── */
let last = performance.now(), acc = 0;
function frame(now){
  let dtRaw = (now - last) / 1000; last = now;
  if (dtRaw > 0.25) dtRaw = 0.25;
  acc += dtRaw;
  const FIXED = 1 / 60;
  let guard = 0;
  while (acc >= FIXED && guard++ < 5){ update(FIXED); acc -= FIXED; }
  render();
  requestAnimationFrame(frame);
}

reset();
drawNext();
requestAnimationFrame(frame);
})();
</script>
