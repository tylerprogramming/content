<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
    .header { padding: 40px 20px; text-align: center; }
    .header h1 { font-size: 48px; font-weight: bold; margin: 0; color: #000; letter-spacing: -1px; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; background: #ffffff; }
    .content { font-size: 18px; }
    .button { display: inline-block; background: #4F46E5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; }
    .footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <h1>tylerai</h1>
  </div>
  <div class="container">
    <div class="content">
      <!-- SUBJECT: keep it plain and specific. What the thing is, not "this week's newsletter". -->
      <!-- SEND: weekly, ongoing, after the 7-day sequence ends -->
      <!-- SHAPE: one idea, one thing they can do, one soft nudge. Keep it under 200 words. -->
      <p>Hey {{first_name}},</p>
      <p><!-- ONE IDEA. Open on the reframe or the problem, plainly. What did you actually run into this week and what did you change. --></p>
      <p><!-- THE THING THEY CAN DO. One concrete action, small enough to do today. Name the skill or the file. --></p>
      <p><!-- WHAT IT COST YOU. The honest limit. What it got wrong, what you still do by hand. This is the part people trust. --></p>
      <p style="text-align: center; margin: 30px 0;">
        <a href="https://www.skool.com/the-ai-agency" class="button">{{CTA_TEXT}}</a>
      </p>
      <p><!-- CLOSE ON A QUESTION. Something you actually want the answer to. Ask them to reply. --></p>
      <p>Tyler</p>
    </div>
  </div>
  <div class="footer">
    <p>You're receiving this because you joined the AI Agency community.</p>
  </div>
</body>
</html>
