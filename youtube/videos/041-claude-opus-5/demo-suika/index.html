<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge Drop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 20%, #2a2140, #17121f);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #stage { position: relative; }
  canvas {
    display: block;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
    cursor: crosshair;
    touch-action: none;
  }
  #over {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(24,18,32,.72); border-radius: 18px;
    backdrop-filter: blur(4px); color: #fff; text-align: center;
  }
  #over h1 { font-size: 42px; letter-spacing: 1px; margin-bottom: 6px; }
  #over p  { font-size: 18px; opacity: .85; margin-bottom: 22px; }
  #over p b { font-size: 30px; display: block; margin-top: 4px; }
  #restart {
    font: 600 18px inherit; color: #2b2140;
    background: #ffd043; border: none; border-radius: 999px;
    padding: 13px 34px; cursor: pointer;
    box-shadow: 0 6px 0 #d9a91e, 0 10px 24px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  #restart:hover { transform: translateY(-2px); }
  #restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9a91e; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="over">
    <h1>Game Over</h1>
    <p>score<b id="finalScore">0</b></p>
    <button id="restart">Play again</button>
  </div>
</div>

<script>
'use strict';

// ---------- setup ----------
const W = 440, H = 640;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
ctx.scale(dpr, dpr);

const WALL = 14;
const LEFT = WALL, RIGHT = W - WALL, FLOOR = H - WALL;
const WALL_TOP = 150;          // where the container walls visually begin
const DANGER_Y = 150;          // overflow line
const DROP_Y = 92;
const G = 2200;                // gravity px/s^2
const REST = 0.18;             // bounciness
const STEP = 1 / 240;          // physics substep

// size, color, points (triangular numbers, like the original)
const TIERS = [
  { r: 14,  c: '#ef5350', s: 1  },
  { r: 19,  c: '#ff8a3d', s: 3  },
  { r: 25,  c: '#ffd043', s: 6  },
  { r: 32,  c: '#9ccc4e', s: 10 },
  { r: 40,  c: '#4dc9a2', s: 15 },
  { r: 49,  c: '#4aa8e8', s: 21 },
  { r: 59,  c: '#5e6fe8', s: 28 },
  { r: 70,  c: '#9061e0', s: 36 },
  { r: 82,  c: '#cd5ed6', s: 45 },
  { r: 95,  c: '#f06292', s: 55 },
  { r: 110, c: '#ffb300', s: 66 },
];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

// ---------- state ----------
let now = 0;
let fruits, particles, popTexts;
let score, best = +(localStorage.getItem('mergeDropBest') || 0);
let cur, nxt, dropX, nextDropAt, over, shake, warn;

function rndTier() {
  const w = [32, 26, 20, 14, 8];
  let t = Math.random() * 100, a = 0;
  for (let i = 0; i < w.length; i++) { a += w[i]; if (t < a) return i; }
  return 0;
}

function reset() {
  fruits = []; particles = []; popTexts = [];
  score = 0; cur = rndTier(); nxt = rndTier();
  dropX = W / 2; nextDropAt = 0; over = false; shake = 0; warn = 0;
  document.getElementById('over').style.display = 'none';
}

function spawnFruit(x, y, tier, vx = 0, vy = 0, popped = false) {
  const f = { x, y, vx, vy, tier, r: TIERS[tier].r, drop: now, overT: 0, dead: false, pop: popped ? now : 0 };
  fruits.push(f);
  return f;
}

// ---------- audio (tiny synth, no assets) ----------
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sndDrop  = () => tone(190, 130, 0.07, 'sine', 0.07);
const sndMerge = t => {
  const f = 240 * Math.pow(1.13, t);
  tone(f, f * 2.1, 0.16, 'sine', 0.16);
  tone(f * 2, f * 3.5, 0.10, 'triangle', 0.05);
};
const sndOver = () => { tone(320, 90, 0.7, 'sawtooth', 0.06); };

// ---------- input ----------
function pointerX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}
function clampDrop(x) { const r = TIERS[cur].r; return clamp(x, LEFT + r + 2, RIGHT - r - 2); }

cv.addEventListener('pointermove', e => { if (!over) dropX = clampDrop(pointerX(e)); });
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (over) return;
  dropX = clampDrop(pointerX(e));
  if (now < nextDropAt) return;
  spawnFruit(dropX, DROP_Y, cur);
  sndDrop();
  nextDropAt = now + 0.45;
  cur = nxt; nxt = rndTier();
  dropX = clampDrop(dropX);
});
document.getElementById('restart').addEventListener('click', () => { initAudio(); reset(); });

// ---------- physics ----------
function sim(dt) {
  for (const f of fruits) {
    f.vy += G * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
  }

  const merges = [];

  for (let iter = 0; iter < 2; iter++) {
    // walls & floor
    for (const f of fruits) {
      if (f.x - f.r < LEFT)  { f.x = LEFT + f.r;  if (f.vx < 0) f.vx = -f.vx * REST; f.vy *= 0.998; }
      if (f.x + f.r > RIGHT) { f.x = RIGHT - f.r; if (f.vx > 0) f.vx = -f.vx * REST; f.vy *= 0.998; }
      if (f.y + f.r > FLOOR) {
        f.y = FLOOR - f.r;
        if (f.vy > 0) f.vy = Math.abs(f.vy) < 60 ? 0 : -f.vy * REST;
        f.vx *= 0.985;
      }
    }
    // fruit vs fruit
    for (let i = 0; i < fruits.length; i++) {
      const a = fruits[i];
      if (a.dead) continue;
      for (let j = i + 1; j < fruits.length; j++) {
        const b = fruits[j];
        if (b.dead) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        const min = a.r + b.r;
        if (d >= min) continue;

        if (a.tier === b.tier && iter === 0) {
          a.dead = b.dead = true;
          merges.push([a, b]);
          continue;
        }

        if (d < 0.01) { d = 0.01; dx = 0.01; dy = 0; }
        const nx = dx / d, ny = dy / d;
        const ma = a.r * a.r, mb = b.r * b.r;
        const ia = 1 / ma, ib = 1 / mb, ims = ia + ib;

        // push apart
        const corr = (min - d) / ims * 0.8;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia;
        b.x += nx * corr * ib; b.y += ny * corr * ib;

        // bounce impulse
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jn = -(1 + REST) * vn / ims;
          a.vx -= jn * nx * ia; a.vy -= jn * ny * ia;
          b.vx += jn * nx * ib; b.vy += jn * ny * ib;
          // light tangential friction so stacks settle
          const tvx = rvx - vn * nx, tvy = rvy - vn * ny;
          const jt = 0.06 / ims;
          a.vx += tvx * jt * ia; a.vy += tvy * jt * ia;
          b.vx -= tvx * jt * ib; b.vy -= tvy * jt * ib;
        }
      }
    }
  }

  if (merges.length) {
    for (const [a, b] of merges) doMerge(a, b);
    fruits = fruits.filter(f => !f.dead);
  }
}

function doMerge(a, b) {
  const nt = a.tier + 1;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const col = TIERS[a.tier].c;

  const pts = nt < TIERS.length ? TIERS[nt].s : 200; // 200 bonus for merging two max fruits
  score += pts;
  if (score > best) { best = score; localStorage.setItem('mergeDropBest', best); }

  burst(mx, my, col, TIERS[a.tier].r);
  popTexts.push({ x: mx, y: my - TIERS[a.tier].r, txt: '+' + pts, life: 1 });
  sndMerge(a.tier);
  shake = Math.min(6, 1.5 + a.tier * 0.6);

  if (nt < TIERS.length) {
    spawnFruit(mx, my, nt, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - 40, true);
  }
}

function burst(x, y, color, r) {
  particles.push({ ring: true, x, y, r: r * 0.6, max: r * 1.9, life: 1, c: color });
  const n = 8 + Math.round(r / 8);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 220;
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60,
      r: 2 + Math.random() * 3.5, life: 1, c: color,
    });
  }
}

function checkOver(dt) {
  warn = 0;
  for (const f of fruits) {
    const top = f.y - f.r;
    if (top < DANGER_Y + 80) warn = Math.max(warn, 1 - Math.max(0, top - DANGER_Y) / 80);
    if (now - f.drop > 0.55 && top < DANGER_Y) {
      f.overT += dt;
      if (f.overT > 1) return gameOver();
    } else {
      f.overT = Math.max(0, f.overT - dt * 2);
    }
  }
}

function gameOver() {
  over = true;
  sndOver();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('over').style.display = 'flex';
}

// ---------- effects ----------
function updateFx(dt) {
  shake = Math.max(0, shake - dt * 18);
  for (const p of particles) {
    p.life -= dt * (p.ring ? 2.6 : 1.8);
    if (!p.ring) {
      p.vy += G * 0.35 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  particles = particles.filter(p => p.life > 0);
  for (const t of popTexts) { t.y -= 42 * dt; t.life -= dt * 1.1; }
  popTexts = popTexts.filter(t => t.life > 0);
}

// ---------- drawing ----------
function drawFruit(f) {
  let scale = 1;
  if (f.pop) {
    const t = (now - f.pop) / 0.22;
    scale = t >= 1 ? 1 : Math.max(0.05, easeOutBack(t));
  }
  const r = f.r * scale;
  const T = TIERS[f.tier];

  const g = ctx.createRadialGradient(f.x - r * 0.35, f.y - r * 0.4, r * 0.1, f.x, f.y, r);
  g.addColorStop(0, shade(T.c, 1.22));
  g.addColorStop(0.65, T.c);
  g.addColorStop(1, shade(T.c, 0.82));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = shade(T.c, 0.7);
  ctx.lineWidth = Math.max(1.5, r * 0.045);
  ctx.stroke();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath();
  ctx.ellipse(f.x - r * 0.34, f.y - r * 0.42, r * 0.22, r * 0.13, -0.7, 0, 7);
  ctx.fill();

  // little face
  if (r > 10) {
    const e = r * 0.09;
    ctx.fillStyle = 'rgba(50,32,40,.6)';
    ctx.beginPath(); ctx.arc(f.x - r * 0.26, f.y - r * 0.05, e, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(f.x + r * 0.26, f.y - r * 0.05, e, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(50,32,40,.6)';
    ctx.lineWidth = Math.max(1.2, r * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(f.x, f.y + r * 0.12, r * 0.2, 0.35, Math.PI - 0.35); ctx.stroke();
  }
}

function landingY() {
  const r = TIERS[cur].r;
  let y = FLOOR - r;
  for (const f of fruits) {
    const dx = Math.abs(f.x - dropX);
    const rr = f.r + r;
    if (dx < rr) {
      const cy = f.y - Math.sqrt(rr * rr - dx * dx);
      if (cy < y) y = cy;
    }
  }
  return Math.max(y, DROP_Y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#f9f3e4');
  bg.addColorStop(1, '#f0e6cf');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // container interior
  ctx.fillStyle = '#fdfaf1';
  ctx.beginPath();
  ctx.roundRect(LEFT, DANGER_Y, RIGHT - LEFT, FLOOR - DANGER_Y, [0, 0, 6, 6]);
  ctx.fill();

  // danger line
  ctx.strokeStyle = `rgba(227,80,80,${0.18 + warn * 0.65})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([9, 8]);
  ctx.beginPath();
  ctx.moveTo(LEFT, DANGER_Y); ctx.lineTo(RIGHT, DANGER_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // aim guide + preview piece
  if (!over) {
    const r = TIERS[cur].r;
    const ly = landingY();
    ctx.strokeStyle = 'rgba(120,100,80,.28)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 7]);
    ctx.beginPath();
    ctx.moveTo(dropX, DROP_Y + r); ctx.lineTo(dropX, ly - r);
    ctx.stroke();
    ctx.setLineDash([]);
    // ghost landing spot
    ctx.strokeStyle = 'rgba(120,100,80,.3)';
    ctx.beginPath(); ctx.arc(dropX, ly, r, 0, 7); ctx.stroke();

    const ready = now >= nextDropAt;
    ctx.globalAlpha = ready ? 1 : 0.45;
    drawFruit({ x: dropX, y: DROP_Y, r, tier: cur, pop: 0 });
    ctx.globalAlpha = 1;
  }

  // fruits
  for (const f of fruits) drawFruit(f);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.ring) {
      const rr = p.r + (p.max - p.r) * (1 - p.life);
      ctx.strokeStyle = p.c;
      ctx.lineWidth = 3 * p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // walls (over the fruit so pieces sit "inside")
  ctx.fillStyle = '#e7d7b8';
  ctx.beginPath();
  ctx.roundRect(0, WALL_TOP - 8, WALL, H - WALL_TOP + 8, [6, 0, 0, 14]);
  ctx.roundRect(W - WALL, WALL_TOP - 8, WALL, H - WALL_TOP + 8, [0, 6, 14, 0]);
  ctx.roundRect(0, H - WALL, W, WALL, [0, 0, 14, 14]);
  ctx.fill();
  ctx.fillStyle = '#d9c49a';
  ctx.fillRect(LEFT - 3, WALL_TOP - 8, 3, FLOOR - WALL_TOP + 8);
  ctx.fillRect(RIGHT, WALL_TOP - 8, 3, FLOOR - WALL_TOP + 8);
  ctx.fillRect(LEFT - 3, FLOOR - 3, RIGHT - LEFT + 6, 3);

  // score popups
  ctx.textAlign = 'center';
  for (const t of popTexts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.font = '800 20px system-ui';
    ctx.fillStyle = '#7a5a20';
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // HUD — score
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8a7758';
  ctx.font = '700 12px system-ui';
  ctx.fillText('SCORE', 24, 30);
  ctx.fillStyle = '#4d3f2c';
  ctx.font = '800 32px system-ui';
  ctx.fillText(score, 24, 60);
  ctx.fillStyle = '#a5916e';
  ctx.font = '600 12px system-ui';
  ctx.fillText('BEST ' + best, 24, 78);

  // HUD — next piece
  const bx = W - 78, by = 44;
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.strokeStyle = '#e0d1b0';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx - 32, by - 30, 64, 64, 14); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8a7758';
  ctx.font = '700 11px system-ui';
  ctx.fillText('NEXT', bx, by - 14);
  drawFruit({ x: bx, y: by + 10, r: 0, tier: nxt, pop: 0, ...{ r: Math.min(16, TIERS[nxt].r) } });

  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now() / 1000, acc = 0;
function frame() {
  requestAnimationFrame(frame);
  const t = performance.now() / 1000;
  now = t;
  const dt = Math.min(t - last, 0.033);
  last = t;
  if (!over) {
    acc += dt;
    while (acc > STEP) { sim(STEP); acc -= STEP; }
    checkOver(dt);
  }
  updateFx(dt);
  draw();
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
