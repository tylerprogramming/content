<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Marketing — Boost Your Startup</title>

<!--
  Rebuilt from a single design screenshot. One file, no framework, no network.

  Everything visual is drawn here: the logo mark, the rocket, the two planets,
  the meteor streaks, the layered colour wave and the teal topographic mesh are
  all inline SVG or CSS gradients. Type is a system stack, since a webfont
  would need the network.

  Layout is proportional (vw-based clamps) so the comp's ratios hold from
  ~1440px down to phone width, where the rocket recedes into the background
  and the nav collapses.
-->

<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --ink:     #0b0b14;
  --indigo:  #6b7ef4;   /* "Your Startup"            */
  --blue:    #2b5ce8;   /* CTA arrow                 */
  --body:    #c3c8d8;   /* hero paragraph            */
  --pill:    #10101c;

  --wrap:    1440px;
  --gutter:  clamp(20px, 8.6vw, 124px);   /* left edge of all content */
  --gutter-r:clamp(16px, 5.4vw, 78px);    /* comp's right edge is tighter */
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--ink);
  color:#fff;
  font:400 16px/1.6 "Helvetica Neue",Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

h1{ margin:0; letter-spacing:-.045em; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }
button{ font:inherit; border:0; background:none; color:inherit; cursor:pointer; }

.wrap{
  width:100%;                       /* required: an auto-margin flex item
                                       shrink-wraps and ignores max-width */
  max-width:var(--wrap);
  margin-inline:auto;
  padding-left:var(--gutter);
  padding-right:var(--gutter-r);
}

/* -------------------------------------------------------------------- hero */
.hero{
  position:relative; isolation:isolate; overflow:hidden;
  min-height:min(100svh, 1000px);
  display:flex; flex-direction:column;
  background:
    radial-gradient(56% 44% at 86% 74%, rgba(10,68,66,.6), transparent 68%),
    radial-gradient(70% 54% at 44% 42%, #20203e, transparent 72%),
    linear-gradient(180deg,#04040a 0%, #0a0a16 24%, #16162e 56%, #121226 100%);
}

/* meteor streaks ------------------------------------------------------------ */
.streak{
  position:absolute; z-index:1; pointer-events:none;
  height:2px; border-radius:2px;
  transform:rotate(54deg); transform-origin:0 50%;
  background:linear-gradient(90deg,
    rgba(255,255,255,0), rgba(255,255,255,.7), rgba(255,255,255,0));
}
.s1{ top:3.5%; left:0.4%;  width:4.2vw; }
.s2{ top:2.5%; left:73.5%; width:3.4vw; }
.s3{ top:21%;  left:43.5%; width:4.6vw; }
.s4{ top:27%;  left:69%;   width:3.2vw; }
.s5{ top:50%;  left:88.5%; width:4.2vw; opacity:.8; }
.s6{ top:57%;  left:52%;   width:3.6vw; opacity:.75; }
.s7{ top:12%;  left:95.5%; width:2.8vw; opacity:.55; }
.s8{ top:39%;  left:5.5%;  width:2.6vw; opacity:.5; }

/* planets ------------------------------------------------------------------- */
.planet{
  position:absolute; z-index:1; border-radius:50%; pointer-events:none;
  aspect-ratio:1;
  background:
    radial-gradient(48% 42% at 33% 27%, #2d2d4a, transparent 70%),
    linear-gradient(150deg,#20203a 0%, #12121f 55%, #0a0a12 100%);
  box-shadow:inset -6px -9px 16px rgba(0,0,0,.55);
}
.planet--lg{ left:60.1%; top:27%;   width:5.6%; }
.planet--sm{ left:10.6%; top:50.5%; width:3.4%; }

/* --------------------------------------------------------------------- nav */
.nav{
  position:relative; z-index:6;
  display:flex; align-items:center;
  padding-top:clamp(18px, 3.6vw, 52px);
}

.brand{ display:flex; align-items:center; gap:clamp(8px,.85vw,12px); margin-right:auto; }
.brand-mark{ width:clamp(38px, 5vw, 72px); aspect-ratio:1; flex:none; }
.brand-name{
  font-size:clamp(14px, 1.4vw, 20px); font-weight:700;
  letter-spacing:-.005em; line-height:1.15; white-space:nowrap;
}
.brand-slogan{
  display:block; margin-top:.28em;
  font-size:.42em; font-weight:500;
  letter-spacing:.19em; text-transform:uppercase; color:rgba(255,255,255,.6);
}

.nav-links{ display:flex; gap:clamp(18px, 8.2vw, 118px); }
.nav-links a{
  font-size:clamp(12px, 1.18vw, 17px); font-weight:400;
  color:rgba(255,255,255,.92); white-space:nowrap;
  padding-bottom:6px; border-bottom:1.5px solid transparent;
  transition:color .18s ease, border-color .18s ease;
}
.nav-links a:hover{ color:#fff; border-bottom-color:rgba(255,255,255,.5); }
.nav-links a[aria-current]{ color:#fff; border-bottom-color:#fff; }

.burger{
  display:grid; gap:clamp(5px,.55vw,8px); flex:none; padding:6px 0;
  margin-left:clamp(20px, 8.6vw, 124px);
}
.burger i{
  display:block; width:clamp(24px, 4.1vw, 59px); height:clamp(2px,.19vw,2.8px);
  border-radius:2px; background:#fff; transition:width .18s ease;
}
.burger i:last-child{ width:clamp(20px, 3.5vw, 50px); }
.burger:hover i:last-child{ width:clamp(24px, 4.1vw, 59px); }

/* ---------------------------------------------------------------- headline */
.hero-main{
  position:relative; z-index:4; flex:1;
  display:flex; align-items:flex-start;
  padding-top:clamp(22px, 4.2vw, 60px);
  padding-bottom:clamp(60px, 10vw, 150px);
}

.copy{ max-width:clamp(280px, 43vw, 620px); }

.copy h1{ font-weight:700; font-size:clamp(44px, 7.15vw, 103px); line-height:1; }
.copy h1 .line2{
  display:block; font-size:.66em; color:var(--indigo);
  margin-top:.09em; white-space:nowrap;
}

.copy .rule{
  display:block; height:1.5px;
  width:clamp(180px, 32.5vw, 468px);
  margin:clamp(6px,.6vw,9px) 0 clamp(10px,1vw,14px);
  background:linear-gradient(90deg, rgba(163,178,255,.95), rgba(163,178,255,.3));
}

.copy p{
  color:var(--body);
  font-size:clamp(13px, 1.53vw, 22px);
  line-height:1.4;
  max-width:clamp(260px, 42vw, 604px);
}

/* rocket -------------------------------------------------------------------- */
.rocket{
  position:absolute; z-index:3; pointer-events:none;
  right:3%; top:26%;
  width:min(40%, 576px);
  filter:drop-shadow(-16px 24px 40px rgba(0,0,0,.5));
}

/* slide dots ---------------------------------------------------------------- */
.dots{
  position:absolute; z-index:6; right:6.2%; top:62%;
  transform:translateY(-50%);
  display:grid; gap:clamp(8px,1.15vw,17px); justify-items:center;
}
.dots button{
  width:clamp(4px,.48vw,7px); aspect-ratio:1; border-radius:50%;
  background:rgba(255,255,255,.45);
  transition:background .18s ease, transform .18s ease;
}
.dots button:hover{ background:#fff; transform:scale(1.5); }
.dots button[aria-current]{ background:#fff; }

/* ----------------------------------------------------------- background art */
.mesh{
  position:absolute; z-index:1; pointer-events:none;
  right:-4%; bottom:0; width:54%; height:50%;
  opacity:.78;
}
.mesh path{ fill:none; stroke:#1aa896; stroke-width:.95; }

.wave{
  position:absolute; z-index:2; pointer-events:none;
  left:0; bottom:0; width:100%; height:min(49.5%, 500px);
}

/* --------------------------------------------------------------- cta + url */
.hero-foot{
  position:absolute; z-index:5; left:0; right:0; bottom:clamp(20px, 3.8vw, 55px);
}
.hero-foot .wrap{
  display:flex; flex-direction:column; align-items:flex-start;
  gap:clamp(4px,.63vw,9px);
}

.cta{
  display:inline-flex; align-items:center; gap:clamp(8px,.85vw,12px);
  background:var(--pill); color:#fff; border-radius:999px;
  padding:clamp(5px,.48vw,7px) clamp(5px,.48vw,7px)
          clamp(5px,.48vw,7px) clamp(14px,1.8vw,26px);
  font-size:clamp(13px, 1.55vw, 22px); font-weight:700;
  box-shadow:0 14px 28px rgba(6,6,16,.36);
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta:hover{ transform:translateY(-2px); box-shadow:0 18px 34px rgba(6,6,16,.44); }
.cta svg{ width:clamp(24px, 2.85vw, 41px); aspect-ratio:1; flex:none; transition:transform .18s ease; }
.cta:hover svg{ transform:translateX(3px); }

.site-url{ color:#141b2f; font-size:clamp(13px, 1.7vw, 25px); font-weight:400; }

/* ---------------------------------------------------------------- responsive */
@media (max-width:1100px){
  .copy{ max-width:min(56vw, 520px); }
  .rocket{ width:min(44%, 460px); right:-2%; top:26%; }
  .nav-links{ gap:clamp(16px, 5vw, 60px); }
  .burger{ margin-left:clamp(16px, 5vw, 60px); }
}

@media (max-width:820px){
  .nav-links{ display:none; }
  .copy{ max-width:none; }
  .copy p{ max-width:34em; }
  .copy h1 .line2{ white-space:normal; }
  .hero-main{ padding-bottom:clamp(150px, 34vw, 300px); }
  .rocket{ width:70%; right:-16%; top:auto; bottom:26%; opacity:.5; }
  .planet--lg{ left:68%; top:20%; width:9%; }
  .planet--sm{ display:none; }
  .dots{ display:none; }
  .mesh{ width:96%; height:38%; right:-6%; opacity:.6; }
  .streak{ transform:rotate(54deg) scale(.8); }
}

@media (max-width:520px){
  .hero{ min-height:auto; }
  .hero-main{ padding-top:26px; padding-bottom:230px; }
  .rocket{ width:88%; right:-28%; bottom:28%; opacity:.38; }
  .wave{ height:330px; }
  .copy .rule{ width:min(100%, 220px); }
  .copy p{ font-size:13.5px; line-height:1.7; }
}

@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>
